<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="도메인 컨트롤러 승격 후 확인 항목">
<rect width="800" height="450" fill="#fff"/>
<g font-family="system-ui,-apple-system,'Malgun Gothic',sans-serif">
<text x="24" y="34" font-size="20" font-weight="700" fill="#1A202C">승격 후 확인할 네 가지</text>
<rect x="24" y="62" width="366" height="150" rx="10" fill="#fff" stroke="#2E4A38" stroke-width="2.5"/>
<text x="44" y="94" font-size="16" font-weight="700" fill="#2E4A38">1. 도메인 컨트롤러 인식</text>
<text x="44" y="124" font-size="13" fill="#1A202C">Get-ADDomainController</text>
<text x="44" y="152" font-size="13" fill="#4A5568">Domain · Forest · IPv4Address</text>
<text x="44" y="178" font-size="13" fill="#4A5568">IsGlobalCatalog 확인</text>
<rect x="410" y="62" width="366" height="150" rx="10" fill="#fff" stroke="#2E4A38" stroke-width="2.5"/>
<text x="430" y="94" font-size="16" font-weight="700" fill="#2E4A38">2. SYSVOL · NETLOGON</text>
<text x="430" y="124" font-size="13" fill="#1A202C">Get-SmbShare</text>
<text x="430" y="152" font-size="13" fill="#4A5568">두 공유가 안 보이면</text>
<text x="430" y="178" font-size="13" fill="#4A5568">디렉터리 서비스 로그 확인</text>
<rect x="24" y="232" width="366" height="150" rx="10" fill="#fff" stroke="#2E4A38" stroke-width="2.5"/>
<text x="44" y="264" font-size="16" font-weight="700" fill="#2E4A38">3. DNS 영역과 SRV 레코드</text>
<text x="44" y="294" font-size="13" fill="#1A202C">Get-DnsServerZone</text>
<text x="44" y="322" font-size="13" fill="#1A202C">Resolve-DnsName -Type SRV</text>
<text x="44" y="348" font-size="13" fill="#4A5568">_ldap._tcp.dc._msdcs 조회</text>
<rect x="410" y="232" width="366" height="150" rx="10" fill="#fff" stroke="#2E4A38" stroke-width="2.5"/>
<text x="430" y="264" font-size="16" font-weight="700" fill="#2E4A38">4. FSMO 역할</text>
<text x="430" y="294" font-size="13" fill="#1A202C">Get-ADForest / Get-ADDomain</text>
<text x="430" y="322" font-size="13" fill="#4A5568">첫 DC 가 다섯 역할을 모두 보유</text>
<text x="430" y="348" font-size="13" fill="#4A5568">두 번째 DC 추가 전까지 단일 장애점</text>
<text x="24" y="418" font-size="14" font-weight="700" fill="#2E4A38">패치 재부팅이 곧 인증 중단입니다. 두 번째 DC 추가를 미루지 마십시오.</text>
</g></svg>
