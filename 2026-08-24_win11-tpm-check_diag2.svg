<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="MBR 디스크를 GPT로 변환하고 UEFI 부팅으로 전환하는 절차">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4A5568"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="30" y="36" font-size="20" font-weight="700" fill="#1A202C">MBR → GPT 변환과 UEFI 부팅 전환 절차</text>

    <rect x="30" y="70" width="170" height="120" rx="8" fill="#ffffff" stroke="#2C5364" stroke-width="2.5"/>
    <text x="46" y="100" font-size="14" font-weight="700" fill="#2C5364">1단계 · 확인</text>
    <text x="46" y="128" font-size="13" fill="#1A202C">Get-Disk 로</text>
    <text x="46" y="150" font-size="13" fill="#1A202C">PartitionStyle</text>
    <text x="46" y="172" font-size="13" fill="#1A202C">MBR 여부 확인</text>

    <rect x="220" y="70" width="170" height="120" rx="8" fill="#ffffff" stroke="#2C5364" stroke-width="2.5"/>
    <text x="236" y="100" font-size="14" font-weight="700" fill="#2C5364">2단계 · 검증</text>
    <text x="236" y="128" font-size="13" fill="#1A202C">mbr2gpt.exe</text>
    <text x="236" y="150" font-size="13" fill="#1A202C">/validate /disk:0</text>
    <text x="236" y="172" font-size="13" fill="#1A202C">/allowFullOS</text>

    <rect x="410" y="70" width="170" height="120" rx="8" fill="#ffffff" stroke="#2C5364" stroke-width="2.5"/>
    <text x="426" y="100" font-size="14" font-weight="700" fill="#2C5364">3단계 · 변환</text>
    <text x="426" y="128" font-size="13" fill="#1A202C">mbr2gpt.exe</text>
    <text x="426" y="150" font-size="13" fill="#1A202C">/convert /disk:0</text>
    <text x="426" y="172" font-size="13" fill="#1A202C">/allowFullOS</text>

    <rect x="600" y="70" width="170" height="120" rx="8" fill="#ffffff" stroke="#2C5364" stroke-width="2.5"/>
    <text x="616" y="100" font-size="14" font-weight="700" fill="#2C5364">4단계 · 펌웨어</text>
    <text x="616" y="128" font-size="13" fill="#1A202C">CSM 해제</text>
    <text x="616" y="150" font-size="13" fill="#1A202C">UEFI 부팅 지정</text>
    <text x="616" y="172" font-size="13" fill="#1A202C">Secure Boot 사용</text>

    <line x1="204" y1="130" x2="216" y2="130" stroke="#4A5568" stroke-width="2" marker-end="url(#ar2)"/>
    <line x1="394" y1="130" x2="406" y2="130" stroke="#4A5568" stroke-width="2" marker-end="url(#ar2)"/>
    <line x1="584" y1="130" x2="596" y2="130" stroke="#4A5568" stroke-width="2" marker-end="url(#ar2)"/>

    <rect x="30" y="240" width="740" height="110" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="50" y="272" font-size="15" font-weight="700" fill="#1A202C">변환 전 확인 사항</text>
    <text x="50" y="300" font-size="14" fill="#1A202C">· 기본 파티션 3개 이하, 확장 파티션 없음, 디스크 앞뒤 여유 공간 확보</text>
    <text x="50" y="326" font-size="14" fill="#1A202C">· /allowFullOS 사용 시 OS 파티션을 줄여 EFI 시스템 파티션을 새로 생성</text>

    <rect x="30" y="378" width="740" height="48" rx="8" fill="#ffffff" stroke="#2C5364" stroke-width="2.5"/>
    <text x="50" y="408" font-size="14" font-weight="700" fill="#2C5364">4단계를 마치기 전에는 부팅되지 않습니다. 변환 전 전체 백업을 확보하십시오.</text>
  </g>
</svg>
