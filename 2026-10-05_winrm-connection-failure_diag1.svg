<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="WinRM 연결 실패를 Test-WSMan 결과로 갈라 서비스 방화벽 인증 권한 네 갈래로 나누는 진단 분기 도식">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">

    <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Test-WSMan 이 갈래를 정합니다</text>

    <rect x="240" y="50" width="320" height="46" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
    <text x="400" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Test-WSMan -ComputerName SRV01</text>
    <text x="400" y="88" text-anchor="middle" font-size="11.5" fill="#6b7280">인증 없이 물어봅니다</text>

    <path d="M320 96 L180 126" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#n2)"/>
    <path d="M480 96 L620 126" stroke="#1f2937" stroke-width="2" marker-end="url(#n1)"/>
    <text x="230" y="116" font-size="12" font-weight="700" fill="#b91c1c">실패</text>
    <text x="548" y="116" font-size="12" font-weight="700" fill="#1f2937">성공</text>

    <rect x="28" y="132" width="364" height="116" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="46" y="156" font-size="13" font-weight="700" fill="#b91c1c">서비스 · 방화벽 · 포트</text>
    <text x="46" y="180" font-size="12" fill="#1f2937">winrm enumerate winrm/config/listener</text>
    <text x="46" y="200" font-size="12" fill="#1f2937">Get-Service WinRM</text>
    <text x="46" y="222" font-size="11.5" fill="#6b7280">HTTP 5985 / HTTPS 5986</text>
    <text x="46" y="240" font-size="11.5" fill="#6b7280">서버는 기본 켜짐 · 클라이언트는 기본 꺼짐</text>

    <rect x="408" y="132" width="364" height="116" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
    <text x="426" y="156" font-size="13" font-weight="700" fill="#1f2937">인증 · 권한</text>
    <text x="426" y="180" font-size="12" fill="#1f2937">경로는 살아 있습니다</text>
    <text x="426" y="202" font-size="11.5" fill="#6b7280">오류 문구를 그대로 읽어 아래로 갈라냅니다</text>
    <text x="426" y="226" font-size="11.5" fill="#6b7280">신뢰 관련 문구인가 · 액세스 거부인가</text>

    <!-- four causes -->
    <rect x="28" y="268" width="366" height="72" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="46" y="292" font-size="12.5" font-weight="700" fill="#1f2937">① Kerberos 를 못 쓰는 상황</text>
    <text x="46" y="312" font-size="11.5" fill="#6b7280">워크그룹 · IP 주소 접속 · 도메인 이름이 아닌 이름</text>
    <text x="46" y="332" font-size="11.5" fill="#1f2937">→ HTTPS 또는 TrustedHosts, 그리고 -Credential</text>

    <rect x="406" y="268" width="366" height="72" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="424" y="292" font-size="12.5" font-weight="700" fill="#1f2937">② 공용 네트워크 프로필</text>
    <text x="424" y="312" font-size="11.5" fill="#6b7280">"Unable to check the status of the firewall"</text>
    <text x="424" y="332" font-size="11.5" fill="#1f2937">→ -SkipNetworkProfileCheck (같은 서브넷까지)</text>

    <rect x="28" y="348" width="366" height="72" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="46" y="372" font-size="12.5" font-weight="700" fill="#1f2937">③ 권한 · 상승</text>
    <text x="46" y="392" font-size="11.5" fill="#6b7280">기본 세션 구성은 Administrators 만 사용 가능</text>
    <text x="46" y="412" font-size="11.5" fill="#1f2937">→ 관리자 권한 실행 · Get-PSSessionConfiguration</text>

    <rect x="406" y="348" width="366" height="72" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="424" y="372" font-size="12.5" font-weight="700" fill="#b91c1c">④ 세션 안에서만 거부</text>
    <text x="424" y="392" font-size="11.5" fill="#6b7280">연결 문제가 아니라 두 번째 홉 문제입니다</text>
    <text x="424" y="412" font-size="11.5" fill="#1f2937">→ 자격 증명 전달 방식을 다시 설계</text>
  </g>
  <defs>
    <marker id="n1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker>
    <marker id="n2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
  </defs>
</svg>
