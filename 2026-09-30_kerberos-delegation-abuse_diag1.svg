<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="무제한 위임 제한된 위임 리소스 기반 제한 위임 세 유형이 각각 어느 계정의 어떤 속성에 기록되는지 비교한 도식">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">

    <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">감사할 자리가 유형마다 다릅니다</text>

    <!-- unconstrained -->
    <rect x="28" y="58" width="744" height="96" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
    <text x="48" y="84" font-size="14.5" font-weight="700" fill="#b91c1c">무제한 (Unconstrained)</text>
    <text x="48" y="108" font-size="12.5" fill="#1f2937">기록 위치 — 그 계정의 userAccountControl</text>
    <text x="430" y="108" font-size="12.5" font-weight="700" fill="#1f2937">TRUSTED_FOR_DELEGATION (0x80000)</text>
    <text x="48" y="130" font-size="12" fill="#6b7280">KDC가 위임 범위를 제한하지 않습니다 — 어느 서비스로든 갈 수 있습니다</text>
    <text x="48" y="148" font-size="12" fill="#b91c1c">→ 서버 한 대의 신뢰도가 도메인 전체의 신뢰도가 됩니다</text>

    <!-- constrained -->
    <rect x="28" y="166" width="744" height="96" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="48" y="192" font-size="14.5" font-weight="700" fill="#1f2937">제한된 (KCD)</text>
    <text x="48" y="216" font-size="12.5" fill="#1f2937">기록 위치 — 프런트엔드 계정</text>
    <text x="430" y="216" font-size="12.5" font-weight="700" fill="#1f2937">msDS-AllowedToDelegateTo</text>
    <text x="48" y="238" font-size="12" fill="#6b7280">허용된 대상 SPN 목록만큼만 갑니다</text>
    <text x="48" y="256" font-size="12" fill="#1f2937">+ TRUSTED_TO_AUTH_FOR_DELEGATION (0x1000000) 이면 <tspan font-weight="700">프로토콜 전환</tspan>까지 허용</text>

    <!-- rbcd -->
    <rect x="28" y="274" width="744" height="96" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2.5"/>
    <text x="48" y="300" font-size="14.5" font-weight="700" fill="#1f2937">리소스 기반 (RBCD)</text>
    <text x="48" y="324" font-size="12.5" font-weight="700" fill="#b91c1c">기록 위치 — 백엔드 계정 (방향이 반대)</text>
    <text x="430" y="324" font-size="12.5" font-weight="700" fill="#1f2937">msDS-AllowedToActOnBehalfOf…</text>
    <text x="48" y="346" font-size="12" fill="#6b7280">결정권이 도메인 관리자가 아니라 리소스 소유자에게 있습니다</text>
    <text x="48" y="364" font-size="12" fill="#b91c1c">→ 프런트엔드만 훑으면 통째로 빠집니다</text>

    <rect x="28" y="384" width="744" height="42" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="400" y="410" text-anchor="middle" font-size="12.5" fill="#1f2937">도메인 컨트롤러가 무제한 위임으로 나오는 것은 정상 — <tspan font-weight="700">DC를 뺀 나머지가 몇 대인지</tspan>가 봐야 할 숫자입니다</text>
  </g>
</svg>
