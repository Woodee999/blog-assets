<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="23" font-weight="700" fill="#1f2937">잠금 전후로 남는 기록의 순서</text>
  <text x="40" y="74" font-size="14" fill="#6b7280">건수가 가장 많은 코드가 원인이 아닙니다</text>

  <!-- stage 1 -->
  <rect x="40" y="110" width="200" height="88" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5" rx="4"/>
  <text x="140" y="140" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">① 틀린 암호가 들어옴</text>
  <text x="140" y="164" font-size="14" fill="#1f2937" text-anchor="middle">4776 · 0xC000006A</text>
  <text x="140" y="186" font-size="13" fill="#6b7280" text-anchor="middle">Source Workstation = 출처</text>

  <line x1="248" y1="154" x2="296" y2="154" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>

  <!-- stage 2 -->
  <rect x="304" y="110" width="200" height="88" fill="#ffffff" stroke="#1f2937" stroke-width="2" rx="4"/>
  <text x="404" y="140" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">② 임계값 도달</text>
  <text x="404" y="164" font-size="14" fill="#1f2937" text-anchor="middle">4740 (잠김)</text>
  <text x="404" y="186" font-size="13" fill="#6b7280" text-anchor="middle">Caller Computer Name</text>

  <line x1="512" y1="154" x2="560" y2="154" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/>

  <!-- stage 3 -->
  <rect x="568" y="110" width="192" height="88" fill="#ffffff" stroke="#1f2937" stroke-width="2" rx="4"/>
  <text x="664" y="140" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">③ 이후 재시도</text>
  <text x="664" y="164" font-size="14" fill="#1f2937" text-anchor="middle">4776 · 0xC0000234</text>
  <text x="664" y="186" font-size="13" fill="#6b7280" text-anchor="middle">4625 · 계정 잠김</text>

  <!-- volume bar -->
  <text x="40" y="256" font-size="14" fill="#6b7280">수집된 건수로 정렬하면</text>
  <rect x="40" y="272" width="120" height="30" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" rx="3"/>
  <text x="100" y="292" font-size="13" fill="#6b7280" text-anchor="middle">0xC000006A 소수</text>
  <rect x="180" y="272" width="430" height="30" fill="#ffffff" stroke="#1f2937" stroke-width="2" rx="3"/>
  <text x="395" y="292" font-size="13" fill="#1f2937" text-anchor="middle">0xC0000234 다수 — 잠긴 뒤 재시도하는 서비스·매핑 드라이브</text>

  <line x1="40" y1="334" x2="760" y2="334" stroke="#6b7280" stroke-width="1"/>
  <text x="40" y="364" font-size="15" font-weight="700" fill="#b91c1c">찾을 것: 시간순으로 0xC000006A가 처음 나온 출처</text>
  <text x="40" y="392" font-size="14" fill="#1f2937">0xC0000234는 정의상 잠긴 뒤에 나오므로 원인 판단에 쓰지 않습니다.</text>
  <text x="40" y="418" font-size="14" fill="#1f2937">4740의 Caller Computer Name은 마지막 시도가 들어온 컴퓨터 이름입니다.</text>
</svg>
