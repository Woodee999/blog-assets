<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs><marker id="n1" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#374151"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="40" y="36" font-size="20" font-weight="700" fill="#111827">세 조건이 모두 맞아야 성립합니다</text>

    <rect x="40" y="72" width="220" height="92" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="150" y="100" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">① 인증을 유도할 수 있다</text>
    <text x="150" y="126" font-size="11" fill="#4B5563" text-anchor="middle">원격 자원 참조만으로도</text>
    <text x="150" y="147" font-size="11" fill="#6B7280" text-anchor="middle">완전히 막기는 어려움</text>

    <rect x="290" y="72" width="220" height="92" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="400" y="100" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">② 중간을 거쳐 갈 수 있다</text>
    <text x="400" y="126" font-size="11" fill="#4B5563" text-anchor="middle">같은 대역에서 도달 가능</text>
    <text x="400" y="147" font-size="11" fill="#6B7280" text-anchor="middle">망 분리로 일부 완화</text>

    <rect x="540" y="72" width="220" height="92" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <text x="650" y="100" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">③ 받는 쪽이 서명을</text>
    <text x="650" y="121" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">요구하지 않는다</text>
    <text x="650" y="147" font-size="11" fill="#4B5563" text-anchor="middle">여기가 실무의 방어선</text>

    <line x1="150" y1="168" x2="150" y2="196" stroke="#374151" stroke-width="2"/>
    <line x1="400" y1="168" x2="400" y2="196" stroke="#374151" stroke-width="2"/>
    <line x1="650" y1="168" x2="650" y2="196" stroke="#374151" stroke-width="2"/>
    <line x1="150" y1="196" x2="650" y2="196" stroke="#374151" stroke-width="2"/>
    <line x1="400" y1="196" x2="400" y2="222" stroke="#374151" stroke-width="2" marker-end="url(#n1)"/>

    <rect x="290" y="228" width="220" height="52" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <text x="400" y="259" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">AND — 릴레이 성립</text>

    <line x1="514" y1="254" x2="566" y2="254" stroke="#C0392B" stroke-width="2" marker-end="url(#n1)"/>
    <rect x="572" y="228" width="188" height="52" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <text x="666" y="259" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">정상 인증으로 처리</text>

    <line x1="40" y1="316" x2="760" y2="316" stroke="#E5E7EB" stroke-width="1"/>
    <text x="40" y="342" font-size="13" fill="#6B7280">암호를 깨거나 해시를 꺼내지 않습니다. 그래서 암호 복잡도로는 이 경로가 닫히지 않습니다.</text>
    <text x="40" y="366" font-size="13" fill="#6B7280">①②는 완전히 없애기 어렵지만, ③ 하나만 끊어도 성립하지 않습니다.</text>
    <text x="40" y="390" font-size="13" fill="#6B7280">③을 끊는 수단이 SMB 서명, LDAP 서명, LDAP 채널 바인딩입니다.</text>
    <text x="40" y="414" font-size="13" fill="#6B7280">도메인 컨트롤러는 기본적으로 서명을 요구합니다 — 문제는 파일 서버와 멤버 서버입니다.</text>
  </g>
</svg>
