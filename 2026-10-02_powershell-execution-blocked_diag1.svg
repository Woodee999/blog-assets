<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="PowerShell 스크립트 실행이 막혔을 때 오류 문구로 실행 정책, 웹 표식, 앱 제어, 언어 모드를 가르는 판단 흐름도">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">

    <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">오류 문구가 막은 주체를 알려줍니다</text>

    <rect x="300" y="56" width="200" height="44" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="400" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">스크립트가 실행되지 않음</text>

    <path d="M400 100 L400 122" stroke="#1f2937" stroke-width="2"/>
    <path d="M110 122 L690 122" stroke="#1f2937" stroke-width="2"/>
    <path d="M110 122 L110 150" stroke="#1f2937" stroke-width="2" marker-end="url(#p1)"/>
    <path d="M303 122 L303 150" stroke="#1f2937" stroke-width="2" marker-end="url(#p1)"/>
    <path d="M497 122 L497 150" stroke="#b91c1c" stroke-width="2" marker-end="url(#p2)"/>
    <path d="M690 122 L690 150" stroke="#1f2937" stroke-width="2" marker-end="url(#p1)"/>

    <!-- 1 -->
    <rect x="24" y="154" width="172" height="150" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="110" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">실행 정책</text>
    <text x="40" y="202" font-size="11.5" fill="#6b7280">UnauthorizedAccess</text>
    <text x="40" y="220" font-size="11.5" fill="#6b7280">PSSecurityException</text>
    <text x="40" y="248" font-size="12" fill="#1f2937">모든 스크립트가</text>
    <text x="40" y="266" font-size="12" fill="#1f2937">똑같이 막힘</text>
    <text x="40" y="292" font-size="11.5" fill="#b91c1c">→ 범위별 값 확인</text>

    <!-- 2 -->
    <rect x="217" y="154" width="172" height="150" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="303" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">웹 표식</text>
    <text x="233" y="202" font-size="11.5" fill="#6b7280">"디지털 서명되지</text>
    <text x="233" y="220" font-size="11.5" fill="#6b7280">않았습니다"</text>
    <text x="233" y="248" font-size="12" fill="#1f2937">받아 온 파일</text>
    <text x="233" y="266" font-size="12" fill="#1f2937">하나만 막힘</text>
    <text x="233" y="292" font-size="11.5" fill="#b91c1c">→ 읽고 나서 Unblock</text>

    <!-- 3 -->
    <rect x="411" y="154" width="172" height="150" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
    <text x="497" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">앱 제어</text>
    <text x="427" y="202" font-size="11.5" fill="#6b7280">AppLocker 이벤트</text>
    <text x="427" y="220" font-size="11.5" fill="#6b7280">8007 (MSI and Script)</text>
    <text x="427" y="248" font-size="12" fill="#1f2937">실행 정책과</text>
    <text x="427" y="266" font-size="12" fill="#1f2937">무관하게 차단</text>
    <text x="427" y="292" font-size="11.5" fill="#b91c1c">→ 정책 담당자와 협의</text>

    <!-- 4 -->
    <rect x="604" y="154" width="172" height="150" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="690" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">언어 모드</text>
    <text x="620" y="202" font-size="11.5" fill="#6b7280">ConstrainedLanguage</text>
    <text x="620" y="230" font-size="12" fill="#1f2937">실행은 되는데</text>
    <text x="620" y="248" font-size="12" fill="#1f2937">특정 줄만 실패</text>
    <text x="620" y="276" font-size="11.5" fill="#b91c1c">→ LanguageMode 확인</text>

    <!-- 하단 -->
    <rect x="24" y="330" width="752" height="86" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="44" y="356" font-size="13" font-weight="700" fill="#1f2937">먼저 갈라야 할 질문</text>
    <text x="44" y="380" font-size="12" fill="#1f2937">· 모든 스크립트가 막히는가, 이 파일 하나만 막히는가 — 정책 문제와 파일 문제를 가릅니다</text>
    <text x="44" y="402" font-size="12" fill="#1f2937">· 실행 자체가 안 되는가, 실행은 되는데 특정 줄에서 실패하는가 — 차단과 기능 제한을 가릅니다</text>
  </g>
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="p2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
</svg>
