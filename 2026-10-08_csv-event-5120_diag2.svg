<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="40" y="52" font-size="23" font-weight="700" fill="#1f2937">코드가 가리키는 계층</text>
  <text x="40" y="80" font-size="15" fill="#6b7280">같은 5120이라도 뒤질 곳이 다릅니다</text>

  <rect x="50" y="116" width="700" height="92" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="74" y="148" font-size="17" font-weight="700" fill="#b91c1c">권한</text>
  <text x="74" y="176" font-size="14" fill="#1f2937">c00000a5 — CSV 소유자 노드에서 관리자 권한 없이 수행한 작업</text>
  <text x="74" y="198" font-size="13" fill="#6b7280">저장소를 보지 않습니다. 권한을 올리거나 소유자가 아닌 노드에서 수행</text>

  <rect x="50" y="224" width="700" height="92" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="74" y="256" font-size="17" font-weight="700" fill="#1f2937">네트워크</text>
  <text x="74" y="284" font-size="14" fill="#1f2937">c0000128 — 이벤트 1135와 함께 확인 · c00000a2 — SMB 사용 여부</text>
  <text x="74" y="306" font-size="13" fill="#6b7280">c00000b5 — 리디렉션 IO 제한 시간 초과 (동기 2분 · 비동기 4분)</text>

  <rect x="50" y="332" width="700" height="92" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="74" y="364" font-size="17" font-weight="700" fill="#1f2937">저장소</text>
  <text x="74" y="392" font-size="14" fill="#1f2937">c00000be — MPIO 구성 · c000009d — 연결 상실 · c0000013 — 저장소 자체</text>
  <text x="74" y="414" font-size="13" fill="#6b7280">공통 전제: 네트워크·저장소 드라이버와 펌웨어를 최신으로</text>
</svg>
