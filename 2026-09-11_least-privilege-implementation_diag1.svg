<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="40" y="36" font-size="20" font-weight="700" fill="#111827">엔터프라이즈 액세스 모델과 기존 계층 대응</text>

    <text x="620" y="72" font-size="13" font-weight="700" fill="#6B7280" text-anchor="middle">기존 계층</text>

    <rect x="40" y="82" width="480" height="80" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <text x="64" y="112" font-size="16" font-weight="700" fill="#C0392B">제어 평면</text>
    <text x="64" y="139" font-size="12" fill="#4B5563">신원 시스템(Active Directory) · 네트워크 접근 통제</text>
    <rect x="548" y="100" width="180" height="44" rx="6" fill="#ffffff" stroke="#C0392B" stroke-width="2"/>
    <text x="638" y="128" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">Tier 0</text>

    <rect x="40" y="174" width="235" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <text x="64" y="204" font-size="15" font-weight="700" fill="#B45309">관리 평면</text>
    <text x="64" y="231" font-size="12" fill="#4B5563">전사 IT 관리 · 인프라</text>

    <rect x="285" y="174" width="235" height="80" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <text x="309" y="204" font-size="15" font-weight="700" fill="#B45309">데이터 · 워크로드 평면</text>
    <text x="309" y="231" font-size="12" fill="#4B5563">업무 응용 프로그램 · 데이터</text>

    <rect x="548" y="192" width="180" height="44" rx="6" fill="#ffffff" stroke="#B45309" stroke-width="2"/>
    <text x="638" y="220" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">Tier 1</text>

    <rect x="40" y="266" width="235" height="80" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="64" y="296" font-size="15" font-weight="700" fill="#111827">사용자 접근</text>
    <text x="64" y="323" font-size="12" fill="#4B5563">내부 사용자 · 협력사 · 고객</text>

    <rect x="285" y="266" width="235" height="80" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="309" y="296" font-size="15" font-weight="700" fill="#111827">앱 접근</text>
    <text x="309" y="323" font-size="12" fill="#4B5563">API · 서비스 계정</text>

    <rect x="548" y="284" width="180" height="44" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="638" y="312" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">Tier 2</text>

    <line x1="40" y1="376" x2="760" y2="376" stroke="#E5E7EB" stroke-width="1"/>
    <text x="40" y="402" font-size="13" fill="#6B7280">제어 평면 계정으로 아래 평면 서버에 로그온하면 두 평면이 섞입니다.</text>
    <text x="40" y="426" font-size="13" fill="#6B7280">계층을 나누는 목적은 문서 정리가 아니라 이 연결을 끊는 것입니다.</text>
  </g>
</svg>
