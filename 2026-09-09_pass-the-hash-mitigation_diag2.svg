<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="40" y="36" font-size="20" font-weight="700" fill="#111827">완화는 세 계층으로 쌓습니다</text>

    <rect x="40" y="66" width="720" height="92" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="2"/>
    <text x="64" y="96" font-size="15" font-weight="700" fill="#4338CA">계층 1 · 기술 — Credential Guard</text>
    <text x="64" y="122" font-size="12" fill="#4B5563">보호: NTLM 해시 · Kerberos TGT · 응용 프로그램이 저장한 도메인 자격 증명</text>
    <text x="64" y="145" font-size="12" fill="#6B7280">보호하지 않음: 도메인 컨트롤러의 AD 데이터베이스, 로컬 계정용 SAM</text>

    <rect x="40" y="172" width="720" height="92" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="64" y="202" font-size="15" font-weight="700" fill="#111827">계층 2 · 계정 — Protected Users 그룹</text>
    <text x="64" y="228" font-size="12" fill="#4B5563">차단: CredSSP 위임 · Windows Digest · NTLM · Kerberos 장기 키 · 오프라인 로그온</text>
    <text x="64" y="251" font-size="12" fill="#C0392B">주의: 관리자 계정을 한꺼번에 넣으면 전부 잠길 수 있음 — 한 명씩, 비상 계정은 제외</text>

    <rect x="40" y="278" width="720" height="92" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="64" y="308" font-size="15" font-weight="700" fill="#111827">계층 3 · 권한 — 로그온 거부 GPO</text>
    <text x="64" y="334" font-size="12" fill="#4B5563">Domain Admins를 멤버 서버·워크스테이션 OU에서 5가지 로그온 권한에 거부로 지정</text>
    <text x="64" y="357" font-size="12" fill="#6B7280">예외: 도메인 컨트롤러 관리용 점프 서버는 이 GPO가 연결되지 않은 OU에 배치</text>

    <line x1="40" y1="398" x2="760" y2="398" stroke="#E5E7EB" stroke-width="1"/>
    <text x="40" y="424" font-size="13" fill="#6B7280">계층 3이 빠지면 앞의 둘을 켜도 관리자 계정이 닿는 서버 수는 그대로입니다.</text>
  </g>
</svg>
