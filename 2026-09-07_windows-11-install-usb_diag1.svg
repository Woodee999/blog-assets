<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="설치 USB 만드는 두 가지 경로 비교">
<rect width="800" height="450" fill="#fff"/>
<defs><marker id="u1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4A5568"/></marker></defs>
<g font-family="system-ui,-apple-system,'Malgun Gothic',sans-serif">
<text x="24" y="34" font-size="20" font-weight="700" fill="#1A202C">설치 USB 만드는 두 경로</text>

<rect x="24" y="60" width="360" height="300" rx="10" fill="#fff" stroke="#2C5364" stroke-width="3"/>
<text x="44" y="92" font-size="16" font-weight="700" fill="#2C5364">미디어 만들기 도구</text>
<text x="44" y="126" font-size="14" fill="#1A202C">① MediaCreationTool.exe 실행</text>
<text x="44" y="156" font-size="14" fill="#1A202C">② 언어·에디션 선택</text>
<text x="44" y="186" font-size="14" fill="#1A202C">③ USB 선택</text>
<text x="44" y="216" font-size="14" fill="#1A202C">④ 자동으로 포맷·복사·부팅 설정</text>
<line x1="44" y1="240" x2="364" y2="240" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="44" y="270" font-size="14" font-weight="700" fill="#2C5364">파일 크기 문제를 도구가 처리</text>
<text x="44" y="300" font-size="13" fill="#4A5568">막히는 게 없다면 여기서 끝냅니다</text>
<text x="44" y="330" font-size="13" fill="#4A5568">USB 8GB 이상 · 기존 데이터 삭제</text>

<rect x="416" y="60" width="360" height="300" rx="10" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="436" y="92" font-size="16" font-weight="700" fill="#475569">ISO 수동 복사</text>
<text x="436" y="126" font-size="14" fill="#1A202C">① ISO 내려받기</text>
<text x="436" y="156" font-size="14" fill="#1A202C">② USB 를 FAT32 로 포맷</text>
<text x="436" y="186" font-size="14" fill="#1A202C">③ ISO 내용 복사</text>
<text x="436" y="216" font-size="14" fill="#1A202C">④ 부팅 확인</text>
<line x1="436" y1="240" x2="756" y2="240" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="436" y="270" font-size="14" font-weight="700" fill="#B45309">install.wim 이 4GB 를 넘으면 실패</text>
<text x="436" y="300" font-size="13" fill="#4A5568">DISM /Split-Image 로 나눠야 합니다</text>
<text x="436" y="330" font-size="13" fill="#4A5568">도구를 못 쓰는 환경에서 선택</text>

<text x="24" y="400" font-size="14" font-weight="700" fill="#2C5364">FAT32 는 UEFI 부팅에 필요하지만 파일 하나가 4GB 를 넘을 수 없습니다</text>
<text x="24" y="426" font-size="13" fill="#4A5568">NTFS 로 바꾸면 이 제한은 사라지지만 UEFI 부팅이 안 되는 장비가 생깁니다</text>
</g></svg>
