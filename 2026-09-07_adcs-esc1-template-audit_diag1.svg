<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="a9" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="40" y="36" font-size="20" font-weight="700" fill="#111827">네 조건이 모두 맞아야 성립합니다</text>

    <rect x="40" y="72" width="300" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="60" y="96" font-size="14" font-weight="700" fill="#111827">① 주체 이름을 요청에 제공</text>
    <text x="60" y="117" font-size="12" fill="#6B7280">msPKI-Certificate-Name-Flag 0x1</text>

    <rect x="40" y="140" width="300" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="60" y="164" font-size="14" font-weight="700" fill="#111827">② 인증용 EKU 포함</text>
    <text x="60" y="185" font-size="12" fill="#6B7280">클라이언트 인증 · 스마트카드 · PKINIT</text>

    <rect x="40" y="208" width="300" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="60" y="232" font-size="14" font-weight="700" fill="#111827">③ 일반 그룹에 등록 권한</text>
    <text x="60" y="253" font-size="12" fill="#6B7280">Authenticated Users · Domain Users</text>

    <rect x="40" y="276" width="300" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="60" y="300" font-size="14" font-weight="700" fill="#111827">④ 보완 통제 없음</text>
    <text x="60" y="321" font-size="12" fill="#6B7280">관리자 승인 플래그 0x2 꺼짐</text>

    <line x1="344" y1="100" x2="410" y2="100" stroke="#374151" stroke-width="2"/>
    <line x1="344" y1="168" x2="410" y2="168" stroke="#374151" stroke-width="2"/>
    <line x1="344" y1="236" x2="410" y2="236" stroke="#374151" stroke-width="2"/>
    <line x1="344" y1="304" x2="410" y2="304" stroke="#374151" stroke-width="2"/>
    <line x1="410" y1="100" x2="410" y2="304" stroke="#374151" stroke-width="2"/>

    <rect x="416" y="176" width="90" height="52" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <text x="461" y="208" font-size="18" font-weight="700" fill="#111827" text-anchor="middle">AND</text>
    <line x1="510" y1="202" x2="556" y2="202" stroke="#C0392B" stroke-width="2" marker-end="url(#a9)"/>

    <rect x="562" y="164" width="200" height="76" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <text x="662" y="194" font-size="15" font-weight="700" fill="#C0392B" text-anchor="middle">위험한 템플릿</text>
    <text x="662" y="220" font-size="12" fill="#4B5563" text-anchor="middle">임의 계정 자격이 성립</text>

    <line x1="40" y1="362" x2="760" y2="362" stroke="#E5E7EB" stroke-width="1"/>
    <text x="40" y="388" font-size="13" fill="#6B7280">AND 구조이므로 네 조건 중 하나만 끊어도 성립하지 않습니다.</text>
    <text x="40" y="412" font-size="13" fill="#6B7280">CA에 게시되지 않은 템플릿은 요청 자체가 불가능하므로 게시 여부도 함께 확인합니다.</text>
  </g>
</svg>
