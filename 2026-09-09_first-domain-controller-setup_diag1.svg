<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="도메인 컨트롤러 승격 절차">
<rect width="800" height="450" fill="#fff"/>
<defs><marker id="d1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2E4A38"/></marker></defs>
<g font-family="system-ui,-apple-system,'Malgun Gothic',sans-serif">
<text x="24" y="34" font-size="20" font-weight="700" fill="#1A202C">승격 전 확정 → 승격 4단계</text>
<rect x="24" y="60" width="752" height="94" rx="10" fill="#fff" stroke="#2E4A38" stroke-width="3"/>
<text x="44" y="90" font-size="16" font-weight="700" fill="#2E4A38">먼저 확정할 것 — 되돌리기 어려운 항목</text>
<text x="44" y="120" font-size="14" fill="#1A202C">도메인 이름 · 포리스트 기능 수준 · 컴퓨터 이름 · 고정 IP · DSRM 암호</text>
<text x="44" y="142" font-size="13" fill="#4A5568">이름과 기능 수준은 승격 후 사실상 변경 불가입니다</text>
<rect x="24" y="186" width="176" height="96" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="42" y="214" font-size="14" font-weight="700" fill="#2E4A38">1. 역할 설치</text>
<text x="42" y="240" font-size="12" fill="#1A202C">Install-</text>
<text x="42" y="258" font-size="12" fill="#1A202C">WindowsFeature</text>
<text x="42" y="276" font-size="12" fill="#4A5568">재시작 불필요</text>
<rect x="216" y="186" width="176" height="96" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="234" y="214" font-size="14" font-weight="700" fill="#2E4A38">2. 사전 검사</text>
<text x="234" y="240" font-size="12" fill="#1A202C">Test-ADDSForest</text>
<text x="234" y="258" font-size="12" fill="#1A202C">Installation</text>
<text x="234" y="276" font-size="12" fill="#4A5568">설치는 하지 않음</text>
<rect x="408" y="186" width="176" height="96" rx="8" fill="#fff" stroke="#2E4A38" stroke-width="2.5"/>
<text x="426" y="214" font-size="14" font-weight="700" fill="#2E4A38">3. 포리스트 승격</text>
<text x="426" y="240" font-size="12" fill="#1A202C">Install-ADDSForest</text>
<text x="426" y="258" font-size="12" fill="#1A202C">DSRM 암호 입력</text>
<text x="426" y="276" font-size="12" fill="#4A5568">자동 재시작</text>
<rect x="600" y="186" width="176" height="96" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="618" y="214" font-size="14" font-weight="700" fill="#2E4A38">4. 승격 후 확인</text>
<text x="618" y="240" font-size="12" fill="#1A202C">서비스 · SYSVOL</text>
<text x="618" y="258" font-size="12" fill="#1A202C">DNS · FSMO</text>
<text x="618" y="276" font-size="12" fill="#4A5568">네 가지 모두</text>
<line x1="204" y1="234" x2="212" y2="234" stroke="#2E4A38" stroke-width="2" marker-end="url(#d1)"/>
<line x1="396" y1="234" x2="404" y2="234" stroke="#2E4A38" stroke-width="2" marker-end="url(#d1)"/>
<line x1="588" y1="234" x2="596" y2="234" stroke="#2E4A38" stroke-width="2" marker-end="url(#d1)"/>
<rect x="24" y="316" width="752" height="86" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="44" y="346" font-size="15" font-weight="700" fill="#1A202C">DSRM 암호는 평문으로 넣지 않습니다</text>
<text x="44" y="376" font-size="14" fill="#1A202C">Read-Host -AsSecureString 으로 받으면 화면에도 스크립트에도 남지 않습니다</text>
<text x="24" y="432" font-size="14" font-weight="700" fill="#2E4A38">첫 DC 는 FSMO 다섯 역할을 모두 갖는 단일 장애점입니다</text>
</g></svg>
