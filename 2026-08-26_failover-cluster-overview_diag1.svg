<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="2노드 장애 조치 클러스터 구성도">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="c1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#28402F"/></marker>
    <marker id="c2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="24" y="34" font-size="20" font-weight="700" fill="#1A202C">2노드 장애 조치 클러스터 구성</text>

    <rect x="24" y="150" width="140" height="64" rx="8" fill="#ffffff" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="44" y="188" font-size="14" fill="#1A202C">클라이언트</text>

    <line x1="168" y1="182" x2="202" y2="182" stroke="#28402F" stroke-width="2" marker-end="url(#c1)"/>
    <text x="150" y="234" font-size="12" fill="#28402F">SMB 445</text>
    <text x="150" y="252" font-size="12" fill="#28402F">서비스 포트</text>

    <rect x="206" y="140" width="170" height="84" rx="8" fill="#ffffff" stroke="#28402F" stroke-width="2.5"/>
    <text x="224" y="172" font-size="14" font-weight="700" fill="#1A202C">클러스터 액세스 지점</text>
    <text x="224" y="196" font-size="13" fill="#4A5568">이름 + 가상 IP</text>
    <text x="224" y="214" font-size="12" fill="#64748B">활성 노드로 연결</text>

    <line x1="380" y1="166" x2="414" y2="122" stroke="#28402F" stroke-width="2" marker-end="url(#c1)"/>
    <line x1="380" y1="198" x2="414" y2="264" stroke="#94A3B8" stroke-width="2" marker-end="url(#c2)"/>

    <rect x="418" y="82" width="170" height="60" rx="8" fill="#ffffff" stroke="#28402F" stroke-width="2.5"/>
    <text x="436" y="108" font-size="14" font-weight="700" fill="#1A202C">노드 1 · 활성</text>
    <text x="436" y="130" font-size="12" fill="#64748B">역할 실행 중</text>

    <rect x="418" y="248" width="170" height="60" rx="8" fill="#ffffff" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="436" y="274" font-size="14" font-weight="700" fill="#1A202C">노드 2 · 대기</text>
    <text x="436" y="296" font-size="12" fill="#64748B">장애 시 역할 인수</text>

    <line x1="592" y1="112" x2="628" y2="168" stroke="#28402F" stroke-width="2" marker-end="url(#c1)"/>
    <line x1="592" y1="278" x2="628" y2="222" stroke="#94A3B8" stroke-width="2" marker-end="url(#c2)"/>

    <rect x="632" y="160" width="146" height="70" rx="8" fill="#ffffff" stroke="#28402F" stroke-width="2.5"/>
    <text x="650" y="188" font-size="14" font-weight="700" fill="#1A202C">공유 스토리지</text>
    <text x="650" y="212" font-size="12" fill="#4A5568">기본 디스크 · NTFS</text>
    <text x="632" y="252" font-size="12" fill="#28402F">iSCSI 3260 / FC</text>

    <rect x="418" y="336" width="300" height="66" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="436" y="364" font-size="14" font-weight="700" fill="#334155">감시(witness) · 투표 1표</text>
    <text x="436" y="388" font-size="12" fill="#4A5568">디스크 / 파일 공유 / 클라우드 중 택 1</text>

    <line x1="500" y1="336" x2="500" y2="310" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4"/>
    <polyline points="430,336 398,336 398,112 414,112" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4"/>

    <text x="24" y="432" font-size="14" font-weight="700" fill="#28402F">노드 2표 + 감시 1표 = 총 3표. 과반 2표를 확보한 쪽이 서비스를 이어받습니다.</text>
  </g>
</svg>
