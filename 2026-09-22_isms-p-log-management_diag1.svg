<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect x="0" y="0" width="800" height="450" fill="#ffffff"/><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#374151"/></marker></defs><g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
<text x="40" y="36" font-size="20" font-weight="700" fill="#111827">안전성 확보조치 기준 제8조 — 시행일로 갈립니다</text>
<text x="40" y="60" font-size="13" fill="#6B7280">제8조를 개정한 것은 고시 제2025-9호(2025-10-31 발령). 부칙에 따라 1·2항만 1년 후 시행.</text>
<rect x="40" y="82" width="350" height="176" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<rect x="40" y="82" width="350" height="32" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="215" y="104" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">지금 ~ 2026-10-30 (종전)</text>
<text x="62" y="140" font-size="13" font-weight="700" fill="#111827">1항 대상</text>
<text x="62" y="162" font-size="13" fill="#4B5563">개인정보취급자</text>
<text x="62" y="196" font-size="13" font-weight="700" fill="#111827">2항 점검</text>
<text x="62" y="218" font-size="13" fill="#4B5563">월 1회 이상</text>
<text x="62" y="240" font-size="12" fill="#4B5563">다운로드 확인 시 사유 확인</text>
<line x1="400" y1="170" x2="426" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#m)"/>
<rect x="440" y="82" width="320" height="176" rx="8" fill="#ffffff" stroke="#C0392B" stroke-width="2"/>
<rect x="440" y="82" width="320" height="32" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
<text x="600" y="104" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">발령 1년 후 ~ (개정)</text>
<text x="462" y="140" font-size="13" font-weight="700" fill="#111827">1항 대상</text>
<text x="462" y="162" font-size="13" font-weight="700" fill="#C0392B">접속한 자 (정보주체 제외)</text>
<text x="462" y="196" font-size="13" font-weight="700" fill="#111827">2항 점검</text>
<text x="462" y="218" font-size="13" font-weight="700" fill="#C0392B">내부 관리계획으로 주기 정함</text>
<text x="462" y="240" font-size="12" fill="#4B5563">후단 삭제</text>
<rect x="40" y="278" width="720" height="46" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="400" y="306" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">보관 기간 1년 / 조건부 2년 — 개정 없음</text>
<line x1="40" y1="352" x2="760" y2="352" stroke="#E5E7EB" stroke-width="1"/>
<text x="40" y="378" font-size="13" fill="#6B7280">2년 조건 셋은 OR — 5만명 이상 / 고유식별정보·민감정보 / 기간통신사업자.</text>
<text x="40" y="402" font-size="13" fill="#6B7280">기간은 시행령이 아니라 고시에 있습니다. 시행령 제30조는 숫자를 적지 않습니다.</text>
<text x="40" y="430" font-size="13" fill="#6B7280">부칙은 「발령한 날의 1년 후」까지만 적습니다 — 날짜를 못 박지 않았습니다.</text>
</g></svg>
