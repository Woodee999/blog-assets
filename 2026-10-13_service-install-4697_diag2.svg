<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="23" font-weight="700" fill="#1f2937">단독 조건이 아니라 조합으로 판정합니다</text>
  <text x="40" y="74" font-size="14" fill="#6b7280">문서의 모니터링 권고를 가중치로 옮긴 형태</text>

  <!-- condition 1 -->
  <rect x="40" y="108" width="330" height="74" fill="#ffffff" stroke="#1f2937" stroke-width="2" rx="4"/>
  <text x="60" y="136" font-size="15" font-weight="700" fill="#1f2937">① 실행 파일 경로</text>
  <text x="60" y="162" font-size="13" fill="#6b7280">%windir% · Program Files 밖인가</text>

  <!-- condition 2 -->
  <rect x="40" y="196" width="330" height="74" fill="#ffffff" stroke="#1f2937" stroke-width="2" rx="4"/>
  <text x="60" y="224" font-size="15" font-weight="700" fill="#1f2937">② 서비스 형식 · 시작 유형</text>
  <text x="60" y="250" font-size="13" fill="#6b7280">0x1 · 0x2 · 0x8 또는 시작 0 · 1 · 4 인가</text>

  <!-- condition 3 -->
  <rect x="40" y="284" width="330" height="74" fill="#ffffff" stroke="#1f2937" stroke-width="2" rx="4"/>
  <text x="60" y="312" font-size="15" font-weight="700" fill="#1f2937">③ 서비스 계정</text>
  <text x="60" y="338" font-size="13" fill="#6b7280">내장 서비스 계정 셋이 아닌가</text>

  <line x1="378" y1="145" x2="438" y2="215" stroke="#6b7280" stroke-width="2" marker-end="url(#ah3)"/>
  <line x1="378" y1="233" x2="438" y2="233" stroke="#6b7280" stroke-width="2" marker-end="url(#ah3)"/>
  <line x1="378" y1="321" x2="438" y2="251" stroke="#6b7280" stroke-width="2" marker-end="url(#ah3)"/>

  <!-- decision -->
  <rect x="446" y="186" width="314" height="94" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5" rx="4"/>
  <text x="603" y="218" font-size="17" font-weight="700" fill="#b91c1c" text-anchor="middle">둘 이상 겹치면 사람이 본다</text>
  <text x="603" y="244" font-size="13" fill="#1f2937" text-anchor="middle">하나만 맞으면 기록으로 남기고</text>
  <text x="603" y="266" font-size="13" fill="#1f2937" text-anchor="middle">주기적 재등록은 제품 단위로 예외</text>

  <line x1="40" y1="386" x2="760" y2="386" stroke="#6b7280" stroke-width="1"/>
  <text x="40" y="412" font-size="14" fill="#1f2937">커널 드라이버에는 서비스 계정이 기록되지 않습니다. ③이 비었다는 이유로 올리지 않습니다.</text>
  <text x="40" y="436" font-size="14" fill="#1f2937">경로는 설치 시점의 값이며, 이후 변경은 이 이벤트에 남지 않습니다.</text>
</svg>
