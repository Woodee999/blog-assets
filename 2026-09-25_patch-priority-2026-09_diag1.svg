<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="CVSS, 악용 가능성 지수, EPSS, KEV 네 신호가 각각 답하는 질문과 놓치는 지점을 비교한 도식">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">

    <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">네 신호는 서로 다른 질문에 답합니다</text>

    <!-- 축 -->
    <text x="36" y="70" font-size="12" font-weight="700" fill="#6b7280">추정 ◄─────────────────────────────────────────────────────► 사실</text>
    <path d="M36 80 L764 80" stroke="#d1d5db" stroke-width="2"/>

    <!-- 카드 4개 -->
    <rect x="30" y="96" width="172" height="150" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="116" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">CVSS</text>
    <text x="116" y="144" text-anchor="middle" font-size="11" fill="#6b7280">피해 크기</text>
    <text x="46" y="174" font-size="11.5" fill="#1f2937">성공하면 얼마나</text>
    <text x="46" y="192" font-size="11.5" fill="#1f2937">심각한가</text>
    <text x="46" y="220" font-size="11" fill="#b91c1c">시도 여부는</text>
    <text x="46" y="236" font-size="11" fill="#b91c1c">말하지 않음</text>

    <rect x="216" y="96" width="172" height="150" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="302" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">악용 가능성 지수</text>
    <text x="302" y="144" text-anchor="middle" font-size="11" fill="#6b7280">난이도</text>
    <text x="232" y="174" font-size="11.5" fill="#1f2937">MSRC가 본</text>
    <text x="232" y="192" font-size="11.5" fill="#1f2937">익스플로잇 난이도</text>
    <text x="232" y="220" font-size="11" fill="#b91c1c">지금 쓰이는지는</text>
    <text x="232" y="236" font-size="11" fill="#b91c1c">별개</text>

    <rect x="402" y="96" width="172" height="150" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="488" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">EPSS</text>
    <text x="488" y="144" text-anchor="middle" font-size="11" fill="#6b7280">확률</text>
    <text x="418" y="174" font-size="11.5" fill="#1f2937">30일 내 악용될</text>
    <text x="418" y="192" font-size="11.5" fill="#1f2937">확률 추정</text>
    <text x="418" y="220" font-size="11" fill="#b91c1c">관측 안 된 표적</text>
    <text x="418" y="236" font-size="11" fill="#b91c1c">공격은 못 잡음</text>

    <rect x="588" y="96" width="182" height="150" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
    <text x="679" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">CISA KEV</text>
    <text x="679" y="144" text-anchor="middle" font-size="11" fill="#6b7280">사실</text>
    <text x="604" y="174" font-size="11.5" fill="#1f2937">악용이 실제로</text>
    <text x="604" y="192" font-size="11.5" fill="#1f2937">확인됨</text>
    <text x="604" y="220" font-size="11" fill="#b91c1c">가장 늦게 붙음</text>
    <text x="604" y="236" font-size="11" fill="#b91c1c">없다고 안전은 아님</text>

    <!-- 이번 달 사례 -->
    <rect x="30" y="268" width="740" height="152" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="48" y="294" font-size="14" font-weight="700" fill="#1f2937">2026년 9월 실제 수치 — 확률과 사실이 어긋난 경우</text>

    <text x="48" y="322" font-size="12" font-weight="700" fill="#6b7280">CVE</text>
    <text x="330" y="322" font-size="12" font-weight="700" fill="#6b7280">CVSS</text>
    <text x="430" y="322" font-size="12" font-weight="700" fill="#6b7280">EPSS</text>
    <text x="560" y="322" font-size="12" font-weight="700" fill="#6b7280">KEV</text>
    <path d="M48 330 L752 330" stroke="#d1d5db" stroke-width="1"/>

    <text x="48" y="352" font-size="12" fill="#b91c1c">CVE-2026-85880  ALPC</text>
    <text x="330" y="352" font-size="12" fill="#b91c1c">7.8</text>
    <text x="430" y="352" font-size="12" fill="#b91c1c">0.0057 (46.0%)</text>
    <text x="560" y="352" font-size="12" font-weight="700" fill="#b91c1c">등재</text>

    <text x="48" y="374" font-size="12" fill="#b91c1c">CVE-2026-81963  Update Stack</text>
    <text x="330" y="374" font-size="12" fill="#b91c1c">7.8</text>
    <text x="430" y="374" font-size="12" fill="#b91c1c">0.0063 (48.8%)</text>
    <text x="560" y="374" font-size="12" font-weight="700" fill="#b91c1c">등재</text>

    <text x="48" y="396" font-size="12" fill="#6b7280">CVE-2026-69676  Kerberos</text>
    <text x="330" y="396" font-size="12" fill="#6b7280">8.8</text>
    <text x="430" y="396" font-size="12" fill="#6b7280">0.0117 (65.9%)</text>
    <text x="560" y="396" font-size="12" fill="#6b7280">아님</text>

    <text x="48" y="414" font-size="11" fill="#6b7280">EPSS가 가장 낮은 두 건이 실제로 악용되고 있었습니다. (EPSS 기준일 2026-09-20)</text>
  </g>
</svg>
