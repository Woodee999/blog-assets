<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="CVSS 벡터의 AV PR UI S 네 항목이 각각 어떤 환경 정보와 대조되는지 연결한 도식">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">

    <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">벡터 네 글자가 곧 확인 목록입니다</text>

    <text x="56" y="70" font-size="12" font-weight="700" fill="#6b7280">벡터 항목</text>
    <text x="330" y="70" font-size="12" font-weight="700" fill="#6b7280">우리가 확인할 것</text>
    <text x="620" y="70" font-size="12" font-weight="700" fill="#6b7280">9월 사례</text>
    <path d="M40 78 L760 78" stroke="#1f2937" stroke-width="2"/>

    <rect x="40" y="92" width="250" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="58" y="118" font-size="14" font-weight="700" fill="#1f2937">AV — 공격 경로</text>
    <text x="58" y="142" font-size="12" fill="#6b7280">N 네트워크 / L 로컬</text>
    <text x="330" y="122" font-size="12.5" fill="#1f2937">그 포트가 어디까지 열려 있는가</text>
    <text x="330" y="144" font-size="11.5" fill="#6b7280">방화벽 규칙 · 경계 장비 설정</text>
    <text x="620" y="132" font-size="11.5" fill="#6b7280">DNS · Netlogon = N</text>

    <rect x="40" y="172" width="250" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="58" y="198" font-size="14" font-weight="700" fill="#1f2937">PR — 필요 권한</text>
    <text x="58" y="222" font-size="12" fill="#6b7280">N 없음 / L 일반 / H 관리자</text>
    <text x="330" y="202" font-size="12.5" fill="#1f2937">계정 없이 되는가</text>
    <text x="330" y="224" font-size="11.5" fill="#6b7280">관리자 권한 부여 현황</text>
    <text x="620" y="212" font-size="11.5" fill="#6b7280">ALPC 85880 = L</text>

    <rect x="40" y="252" width="250" height="70" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="58" y="278" font-size="14" font-weight="700" fill="#1f2937">UI — 사용자 조작</text>
    <text x="58" y="302" font-size="12" fill="#6b7280">N 불필요 / R 필요</text>
    <text x="330" y="282" font-size="12.5" fill="#1f2937">교육으로 막을 수 있는가</text>
    <text x="330" y="304" font-size="11.5" fill="#6b7280">미리 보기 창 · 보호된 보기 설정</text>
    <text x="620" y="284" font-size="11.5" fill="#6b7280">78509 = N (9.8)</text>
    <text x="620" y="302" font-size="11.5" fill="#6b7280">78525 = R (8.8)</text>

    <rect x="40" y="332" width="250" height="70" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
    <text x="58" y="358" font-size="14" font-weight="700" fill="#b91c1c">S — 범위</text>
    <text x="58" y="382" font-size="12" fill="#6b7280">U 그대로 / C 변경</text>
    <text x="330" y="362" font-size="12.5" fill="#1f2937">한 대로 끝나는가, 번지는가</text>
    <text x="330" y="384" font-size="11.5" fill="#6b7280">가상화 호스트 · 경계 구성 요소 목록</text>
    <text x="620" y="364" font-size="11.5" fill="#b91c1c">Hyper-V 69603 = C</text>
    <text x="620" y="382" font-size="11.5" fill="#6b7280">점수는 8.8</text>

    <text x="40" y="430" font-size="11.5" fill="#6b7280">S:C 는 점수와 무관하게 따로 표시합니다. 피해가 그 시스템에서 끝나지 않습니다.</text>
  </g>
</svg>
