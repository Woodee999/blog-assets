<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="문서 처리 중 원격 코드 실행으로 사용자 권한을 얻고 로컬 권한 상승으로 SYSTEM까지 이어지는 공격 체인 도식">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">

    <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">따로 보면 덜 급하고, 붙이면 단말이 넘어갑니다</text>

    <!-- 권한 레벨 띠 -->
    <text x="40" y="92" font-size="11" font-weight="700" fill="#6b7280">권한 없음</text>
    <text x="40" y="212" font-size="11" font-weight="700" fill="#6b7280">사용자</text>
    <text x="40" y="332" font-size="11" font-weight="700" fill="#6b7280">SYSTEM</text>
    <path d="M110 78 L760 78" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M110 198 L760 198" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M110 318 L760 318" stroke="#e5e7eb" stroke-width="1"/>

    <!-- 1단계 -->
    <rect x="130" y="88" width="250" height="88" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="255" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">① 조작된 문서 · 메일 도착</text>
    <text x="148" y="140" font-size="12" fill="#1f2937">CVE-2026-78510  Word  9.8</text>
    <text x="148" y="162" font-size="12" fill="#1f2937">CVE-2026-78509  Outlook  9.8</text>
    

    <path d="M255 176 L255 206" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#c1)"/>
    <text x="268" y="196" font-size="11" fill="#b91c1c">사용자 권한 획득</text>

    <!-- 2단계 -->
    <rect x="130" y="208" width="250" height="88" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
    <text x="255" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">② 로컬 권한 상승</text>
    <text x="148" y="254" font-size="12" fill="#1f2937">CVE-2026-81963  Update Stack</text>
    <text x="148" y="272" font-size="12" fill="#1f2937">CVE-2026-85880  ALPC</text>
    <text x="148" y="289" font-size="10.5" fill="#6b7280">AV:L · PR:L · UI:N · KEV 등재</text>

    <path d="M255 296 L255 326" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#c1)"/>

    <!-- 3단계 -->
    <rect x="130" y="328" width="250" height="60" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="255" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">③ SYSTEM 권한</text>
    <text x="255" y="372" text-anchor="middle" font-size="11" fill="#6b7280">자격 증명 탈취 · 지속성 확보로 이어짐</text>

    <!-- 우측 해설 -->
    <rect x="420" y="88" width="346" height="88" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="438" y="112" font-size="13" font-weight="700" fill="#6b7280">앞단을 막는 것</text>
    <text x="438" y="134" font-size="12" fill="#1f2937">· Office 보안 업데이트 적용</text>
    <text x="438" y="152" font-size="12" fill="#1f2937">· 미리 보기 창 비활성화 (외부 메일)</text>
    <text x="438" y="170" font-size="12" fill="#1f2937">· 웹 표식 유지 → 보호된 보기</text>

    <rect x="420" y="208" width="346" height="88" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <text x="438" y="232" font-size="13" font-weight="700" fill="#b91c1c">뒷단을 막는 것</text>
    <text x="438" y="252" font-size="12" fill="#1f2937">· 빌드 올리는 방법뿐입니다</text>
    <text x="438" y="270" font-size="12" fill="#1f2937">  24H2/25H2 → 26100/26200.9457</text>
    <text x="438" y="286" font-size="12" fill="#1f2937">  26H1 → 28000.2956</text>

    <rect x="420" y="328" width="346" height="60" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="438" y="352" font-size="12" fill="#6b7280">일반 사용자에게 로컬 관리자 권한을 주지 않아도</text>
    <text x="438" y="372" font-size="12" fill="#6b7280">②는 막히지 않습니다. PR:L 이면 충분합니다.</text>
  </g>
  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
</svg>
