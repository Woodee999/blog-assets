<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="보안 공지 한 건을 네 단계로 걸러내는 흐름도">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs><marker id="rs" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4A5568"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="24" y="34" font-size="20" font-weight="700" fill="#1A202C">공지 한 건을 거르는 순서</text>

    <rect x="24" y="60" width="300" height="58" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <text x="44" y="86" font-size="15" font-weight="700" fill="#1A202C">1. 제품과 버전</text>
    <text x="44" y="108" font-size="13" fill="#4A5568">그 역할이 실제로 설치돼 있는가</text>

    <rect x="24" y="150" width="300" height="58" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <text x="44" y="176" font-size="15" font-weight="700" fill="#1A202C">2. 악용 상태</text>
    <text x="44" y="198" font-size="13" fill="#4A5568">악용 확인 / 가능성 높음 / 낮음</text>

    <rect x="24" y="240" width="300" height="58" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <text x="44" y="266" font-size="15" font-weight="700" fill="#1A202C">3. 사전 공개 여부</text>
    <text x="44" y="288" font-size="13" fill="#4A5568">패치 전 공개됐다면 시간 여유가 짧다</text>

    <rect x="24" y="330" width="300" height="58" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <text x="44" y="356" font-size="15" font-weight="700" fill="#1A202C">4. 공격 전제 조건</text>
    <text x="44" y="378" font-size="13" fill="#4A5568">원격 무인증 / 로컬 / 상호작용 필요</text>

    <line x1="174" y1="118" x2="174" y2="148" stroke="#4A5568" stroke-width="2" marker-end="url(#rs)"/>
    <line x1="174" y1="208" x2="174" y2="238" stroke="#4A5568" stroke-width="2" marker-end="url(#rs)"/>
    <line x1="174" y1="298" x2="174" y2="328" stroke="#4A5568" stroke-width="2" marker-end="url(#rs)"/>

    <rect x="392" y="60" width="384" height="58" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="412" y="95" font-size="14" fill="#1A202C">설치돼 있지 않다 → 여기서 종료 (해당 없음)</text>

    <rect x="392" y="150" width="384" height="58" rx="8" fill="#ffffff" stroke="#B45309" stroke-width="2.5"/>
    <text x="412" y="182" font-size="14" font-weight="700" fill="#B45309">악용 확인 → 정기 창을 기다리지 않는다</text>
    <text x="412" y="200" font-size="12" fill="#4A5568">CVSS 점수와 무관하게 최우선</text>

    <rect x="392" y="240" width="384" height="58" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="412" y="266" font-size="14" fill="#1A202C">사전 공개 + 외부 노출 자산 → 이번 주 내</text>
    <text x="412" y="288" font-size="13" fill="#4A5568">내부 자산이면 탐지 규칙부터 확인</text>

    <rect x="392" y="330" width="384" height="58" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="412" y="356" font-size="14" fill="#1A202C">원격 무인증 + 외부 도달 가능 → 즉시</text>
    <text x="412" y="378" font-size="13" fill="#4A5568">그 외에는 정기 창에서 처리</text>

    <line x1="328" y1="89" x2="388" y2="89" stroke="#94A3B8" stroke-width="2" marker-end="url(#rs)"/>
    <line x1="328" y1="179" x2="388" y2="179" stroke="#B45309" stroke-width="2" marker-end="url(#rs)"/>
    <line x1="328" y1="269" x2="388" y2="269" stroke="#94A3B8" stroke-width="2" marker-end="url(#rs)"/>
    <line x1="328" y1="359" x2="388" y2="359" stroke="#94A3B8" stroke-width="2" marker-end="url(#rs)"/>

    <text x="24" y="424" font-size="14" font-weight="700" fill="#334155">1번에서 대부분이 걸러집니다. 총 건수가 아니라 남는 건수가 대응 규모입니다.</text>
  </g>
</svg>
