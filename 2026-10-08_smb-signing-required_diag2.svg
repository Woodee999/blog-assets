<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="40" y="52" font-size="23" font-weight="700" fill="#1f2937">끊길 때 나오는 두 가지</text>
  <text x="40" y="80" font-size="15" fill="#6b7280">둘 다 느려짐이 아니라 연결 실패입니다</text>

  <rect x="50" y="120" width="340" height="190" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="74" y="154" font-size="17" font-weight="700" fill="#b91c1c">① 서명 불일치</text>
  <text x="74" y="186" font-size="14" fill="#1f2937">0xc000a000</text>
  <text x="74" y="210" font-size="14" fill="#1f2937">STATUS_INVALID_SIGNATURE</text>
  <text x="74" y="240" font-size="14" fill="#6b7280">제3자 서버 · NAS · 복합기</text>
  <text x="74" y="264" font-size="14" fill="#6b7280">상대 쪽 구현과 펌웨어를 봅니다</text>
  <text x="74" y="290" font-size="13" fill="#9ca3af">Windows 설정만 봐서는 안 나옵니다</text>

  <rect x="410" y="120" width="340" height="190" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="434" y="154" font-size="17" font-weight="700" fill="#b91c1c">② 게스트 접근 차단</text>
  <text x="434" y="186" font-size="14" fill="#1f2937">서명 요구 시 게스트 폴백이</text>
  <text x="434" y="210" font-size="14" fill="#1f2937">함께 꺼집니다</text>
  <text x="434" y="240" font-size="14" fill="#6b7280">스캐너의 공유 폴더 전송</text>
  <text x="434" y="264" font-size="14" fill="#6b7280">자격 증명 없이 붙던 백업 장비</text>
  <text x="434" y="290" font-size="13" fill="#9ca3af">"...block unauthenticated guest access."</text>

  <rect x="50" y="338" width="700" height="62" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="74" y="364" font-size="15" fill="#1f2937">끊기는 쪽은 대개 Windows가 아니라 Windows에 붙던 장비입니다</text>
  <text x="74" y="388" font-size="14" fill="#6b7280">적용 전에 목록을 만들고, 클라이언트 쪽부터 잡습니다</text>
</svg>
