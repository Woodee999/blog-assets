<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="40" y="46" font-size="23" font-weight="700" fill="#1f2937">잠금 추적에 필요한 세 이벤트</text>
  <text x="40" y="74" font-size="14" fill="#6b7280">이벤트마다 감사 하위 범주와 기록되는 컴퓨터가 다릅니다</text>

  <text x="48" y="112" font-size="13" fill="#6b7280">이벤트</text>
  <text x="212" y="112" font-size="13" fill="#6b7280">감사 하위 범주 (범주)</text>
  <text x="524" y="112" font-size="13" fill="#6b7280">기록되는 곳</text>
  <line x1="40" y1="122" x2="760" y2="122" stroke="#6b7280" stroke-width="1"/>

  <!-- row 1 : 4740 -->
  <rect x="40" y="136" width="150" height="62" fill="#ffffff" stroke="#1f2937" stroke-width="2" rx="4"/>
  <text x="115" y="162" font-size="21" font-weight="700" fill="#1f2937" text-anchor="middle">4740</text>
  <text x="115" y="184" font-size="13" fill="#6b7280" text-anchor="middle">계정이 잠겼다</text>
  <text x="212" y="160" font-size="15" fill="#1f2937">사용자 계정 관리 감사</text>
  <text x="212" y="184" font-size="13" fill="#6b7280">계정 관리 · 기본값 성공</text>
  <text x="524" y="160" font-size="14" fill="#1f2937">도메인 컨트롤러 ·</text>
  <text x="524" y="182" font-size="14" fill="#1f2937">멤버 서버 · 워크스테이션</text>

  <!-- row 2 : 4625 -->
  <rect x="40" y="224" width="150" height="62" fill="#ffffff" stroke="#1f2937" stroke-width="2" rx="4"/>
  <text x="115" y="250" font-size="21" font-weight="700" fill="#1f2937" text-anchor="middle">4625</text>
  <text x="115" y="272" font-size="13" fill="#6b7280" text-anchor="middle">잠긴 뒤의 시도</text>
  <text x="212" y="248" font-size="15" fill="#1f2937">계정 잠금 감사 · 로그온 감사</text>
  <text x="212" y="272" font-size="13" fill="#6b7280">로그온/로그오프 · 로그온 감사 쪽에서 기록</text>
  <text x="524" y="248" font-size="14" fill="#1f2937">로그온을 시도한</text>
  <text x="524" y="270" font-size="14" fill="#1f2937">컴퓨터</text>

  <!-- row 3 : 4776 -->
  <rect x="40" y="312" width="150" height="62" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5" rx="4"/>
  <text x="115" y="338" font-size="21" font-weight="700" fill="#b91c1c" text-anchor="middle">4776</text>
  <text x="115" y="360" font-size="13" fill="#b91c1c" text-anchor="middle">틀린 암호의 출처</text>
  <text x="212" y="336" font-size="15" font-weight="700" fill="#b91c1c">자격 증명 유효성 검사 감사</text>
  <text x="212" y="360" font-size="13" font-weight="700" fill="#b91c1c">계정 로그온 · 기본값 없음 (성공·실패 모두)</text>
  <text x="524" y="336" font-size="14" fill="#1f2937">자격 증명의 권한을</text>
  <text x="524" y="358" font-size="14" fill="#1f2937">가진 컴퓨터 (도메인 계정이면 DC)</text>

  <line x1="40" y1="398" x2="760" y2="398" stroke="#6b7280" stroke-width="1"/>
  <text x="40" y="424" font-size="14" font-weight="700" fill="#b91c1c">4776을 내는 하위 범주만 기본값이 꺼져 있습니다. 켜지 않으면 출처를 좁힐 수 없습니다.</text>
</svg>
