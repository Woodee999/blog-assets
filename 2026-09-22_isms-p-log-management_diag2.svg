<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect x="0" y="0" width="800" height="450" fill="#ffffff"/><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#374151"/></marker></defs><g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
<text x="40" y="36" font-size="20" font-weight="700" fill="#111827">보안 로그가 가득 찼을 때 — 세 가지 동작</text>
<rect x="40" y="66" width="230" height="150" rx="8" fill="#ffffff" stroke="#C0392B" stroke-width="2"/>
<rect x="40" y="66" width="230" height="30" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
<text x="155" y="87" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">기본값 — 덮어씀</text>
<text x="62" y="122" font-size="13" fill="#4B5563">Retention 사용 안 함</text>
<text x="62" y="150" font-size="13" fill="#4B5563">오래된 이벤트부터 삭제</text>
<text x="62" y="184" font-size="13" font-weight="700" fill="#C0392B">며칠이면 초기 기록 소실</text>
<text x="62" y="206" font-size="12" fill="#6B7280">보관 요건 충족 불가</text>
<rect x="285" y="66" width="230" height="150" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<rect x="285" y="66" width="230" height="30" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="400" y="87" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Retention 만 사용</text>
<text x="307" y="122" font-size="13" fill="#4B5563">덮어쓰지 않음</text>
<text x="307" y="150" font-size="13" font-weight="700" fill="#C0392B">가득 차면 기록 중단</text>
<text x="307" y="184" font-size="13" fill="#4B5563">이후 이벤트가 사라짐</text>
<text x="307" y="206" font-size="12" fill="#6B7280">단독 사용은 위험</text>
<rect x="530" y="66" width="230" height="150" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<rect x="530" y="66" width="230" height="30" rx="8" fill="#E8F5E9" stroke="#374151" stroke-width="2"/>
<text x="645" y="87" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Retention + AutoBackup</text>
<text x="552" y="122" font-size="13" font-weight="700" fill="#111827">파일 닫고 이름 변경 후 보관</text>
<text x="552" y="150" font-size="13" fill="#4B5563">새 파일로 계속 기록</text>
<text x="552" y="178" font-size="12" fill="#4B5563">이벤트 1105 기록됨</text>
<text x="552" y="202" font-size="12" fill="#4B5563">Archive-Security-*.evtx</text>
<rect x="40" y="238" width="720" height="66" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="62" y="264" font-size="14" font-weight="700" fill="#111827">wevtutil sl Security /ms:1073741824 /rt:true /ab:true</text>
<text x="62" y="290" font-size="12" fill="#4B5563">/ms 는 바이트 단위, 최소 1048576 · /ab:true 는 /rt:true 를 요구</text>
<line x1="40" y1="332" x2="760" y2="332" stroke="#E5E7EB" stroke-width="1"/>
<text x="40" y="358" font-size="13" fill="#6B7280">자동 백업은 같은 서버·같은 볼륨에 쌓입니다. 위·변조 방지(3항) 관점에서는 부족합니다.</text>
<text x="40" y="382" font-size="13" fill="#6B7280">별도 수집 서버나 SIEM으로 보내고, 로컬 백업은 수집이 끊겼을 때의 보조 수단으로 둡니다.</text>
<text x="40" y="414" font-size="13" fill="#6B7280">서버 로그는 접속기록의 일부입니다. 처리한 정보주체·수행업무는 응용이 남겨야 합니다.</text>
</g></svg>
