<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="설치 USB 부팅 실패 확인 순서">
<rect width="800" height="450" fill="#fff"/>
<defs><marker id="u2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4A5568"/></marker></defs>
<g font-family="system-ui,-apple-system,'Malgun Gothic',sans-serif">
<text x="24" y="34" font-size="20" font-weight="700" fill="#1A202C">USB 로 부팅이 안 될 때 확인 순서</text>
<rect x="24" y="60" width="300" height="60" rx="8" fill="#fff" stroke="#2C5364" stroke-width="2.5"/>
<text x="44" y="86" font-size="15" font-weight="700" fill="#1A202C">1. 펌웨어 부팅 모드</text>
<text x="44" y="108" font-size="13" fill="#4A5568">UEFI 항목과 일반 항목 구분</text>
<rect x="24" y="150" width="300" height="60" rx="8" fill="#fff" stroke="#2C5364" stroke-width="2.5"/>
<text x="44" y="176" font-size="15" font-weight="700" fill="#1A202C">2. Secure Boot</text>
<text x="44" y="198" font-size="13" fill="#4A5568">서드파티 도구 제작 미디어 거부</text>
<rect x="24" y="240" width="300" height="60" rx="8" fill="#fff" stroke="#2C5364" stroke-width="2.5"/>
<text x="44" y="266" font-size="15" font-weight="700" fill="#1A202C">3. USB 포트</text>
<text x="44" y="288" font-size="13" fill="#4A5568">USB 3.x 인식 불안정 사례</text>
<rect x="24" y="330" width="300" height="60" rx="8" fill="#fff" stroke="#2C5364" stroke-width="2.5"/>
<text x="44" y="356" font-size="15" font-weight="700" fill="#1A202C">4. 파일 누락</text>
<text x="44" y="378" font-size="13" fill="#4A5568">sources 폴더 직접 확인</text>
<line x1="174" y1="120" x2="174" y2="148" stroke="#4A5568" stroke-width="2" marker-end="url(#u2)"/>
<line x1="174" y1="210" x2="174" y2="238" stroke="#4A5568" stroke-width="2" marker-end="url(#u2)"/>
<line x1="174" y1="300" x2="174" y2="328" stroke="#4A5568" stroke-width="2" marker-end="url(#u2)"/>
<rect x="380" y="60" width="396" height="60" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="400" y="95" font-size="14" fill="#1A202C">부팅 메뉴에 같은 USB 가 두 개로 보이면 방식이 갈립니다</text>
<rect x="380" y="150" width="396" height="60" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="400" y="185" font-size="14" fill="#1A202C">Microsoft 도구로 만든 미디어는 정상 동작합니다</text>
<rect x="380" y="240" width="396" height="60" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="400" y="275" font-size="14" fill="#1A202C">USB 2.0 포트로 바꿔 다시 시도</text>
<rect x="380" y="330" width="396" height="60" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="400" y="358" font-size="14" fill="#1A202C">install.wim 또는 install*.swm 존재 확인</text>
<text x="400" y="380" font-size="13" fill="#4A5568">복사가 중간에 끊겼을 수 있습니다</text>
<line x1="328" y1="90" x2="376" y2="90" stroke="#94A3B8" stroke-width="2" marker-end="url(#u2)"/>
<line x1="328" y1="180" x2="376" y2="180" stroke="#94A3B8" stroke-width="2" marker-end="url(#u2)"/>
<line x1="328" y1="270" x2="376" y2="270" stroke="#94A3B8" stroke-width="2" marker-end="url(#u2)"/>
<line x1="328" y1="360" x2="376" y2="360" stroke="#94A3B8" stroke-width="2" marker-end="url(#u2)"/>
<text x="24" y="424" font-size="14" font-weight="700" fill="#2C5364">USB 가 정상이어도 TPM·Secure Boot 요구사항에서 따로 막힐 수 있습니다</text>
</g></svg>
