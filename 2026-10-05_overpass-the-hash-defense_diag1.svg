<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text x="40" y="52" font-size="23" font-weight="700" fill="#1f2937">세 기법이 쓰는 재료가 다릅니다</text>
  <text x="40" y="80" font-size="15" fill="#6b7280">NTLM 차단은 가장 위 경로만 닫습니다</text>

  <text x="46" y="140" font-size="15" font-weight="700" fill="#6b7280">2017</text>
  <rect x="100" y="116" width="170" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="118" y="144" font-size="15" fill="#1f2937">훔친 NTLM 해시</text>
  <path d="M278 138 L370 138" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="380" y="116" width="170" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="398" y="144" font-size="15" fill="#1f2937">NTLM 인증</text>
  <text x="574" y="144" font-size="15" font-weight="700" fill="#1f2937">Pass-the-Hash</text>

  <text x="46" y="246" font-size="15" font-weight="700" fill="#b91c1c">2002</text>
  <rect x="100" y="222" width="170" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="118" y="250" font-size="15" fill="#1f2937">훔친 NTLM 해시</text>
  <path d="M278 244 L370 244" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#r)"/>
  <rect x="380" y="222" width="170" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="398" y="250" font-size="15" fill="#1f2937">Kerberos 티켓 발급</text>
  <text x="574" y="250" font-size="15" font-weight="700" fill="#b91c1c">Overpass-the-Hash</text>

  <text x="46" y="352" font-size="15" font-weight="700" fill="#6b7280">2018</text>
  <rect x="100" y="328" width="170" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="118" y="356" font-size="15" fill="#1f2937">훔친 티켓</text>
  <path d="M278 350 L370 350" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="380" y="328" width="170" height="44" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="398" y="356" font-size="15" fill="#1f2937">다른 컴퓨터에서 재사용</text>
  <text x="574" y="356" font-size="15" font-weight="700" fill="#1f2937">Pass-the-Ticket</text>

  <text x="46" y="418" font-size="14" fill="#9ca3af">숫자는 Microsoft Defender for Identity 경보의 External ID</text>
</svg>
