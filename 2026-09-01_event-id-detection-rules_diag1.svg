    <text x="110" y="146" font-size="13" fill="#4B5563" text-anchor="middle">4625</text>
    <text x="110" y="170" font-size="12" fill="#6B7280" text-anchor="middle">로그온 실패</text>

    <line x1="184" y1="136" x2="216" y2="136" stroke="#374151" stroke-width="2" marker-end="url(#a3)"/>

    <rect x="222" y="76" width="160" height="120" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
