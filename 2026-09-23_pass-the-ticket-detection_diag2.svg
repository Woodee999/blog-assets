<text x="40" y="378" font-size="13" fill="#6B7280">오탐이 납니다 — TGT 수명이 10시간이라 조회 구간이 짧으면 정상 세션도 4768 없이 보입니다.</text>
<text x="40" y="402" font-size="13" fill="#6B7280">조회 구간을 티켓 수명보다 길게 잡는 것이 전제입니다.</text>
<text x="40" y="430" font-size="13" fill="#6B7280">Protected Users 는 TGT 수명을 4시간으로 고정해 노출 구간을 줄입니다.</text>
