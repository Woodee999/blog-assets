<text x="40" y="326" font-size="13" fill="#6B7280">항목 번호와 항목명은 안정적이지만, 기준 문안과 증적 목록은 안내서 판본에 따라 달라집니다.</text>
<text x="40" y="350" font-size="13" fill="#6B7280">문안이 필요하면 심사받는 시점의 KISA 안내서를 직접 확인하십시오.</text>
