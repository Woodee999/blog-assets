<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="PowerShell 병행 설치 구조">
<rect width="800" height="450" fill="#fff"/>
<g font-family="system-ui,-apple-system,'Malgun Gothic',sans-serif">
<text x="24" y="34" font-size="20" font-weight="700" fill="#1A202C">둘은 나란히 설치됩니다</text>
<rect x="24" y="66" width="360" height="290" rx="10" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="44" y="100" font-size="17" font-weight="700" fill="#475569">powershell.exe</text>
<text x="44" y="126" font-size="14" fill="#334155">Windows PowerShell 5.1</text>
<line x1="44" y1="146" x2="364" y2="146" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="44" y="178" font-size="13" fill="#4A5568">런타임</text><text x="150" y="178" font-size="13" fill="#1A202C">.NET Framework 4.5</text>
<text x="44" y="210" font-size="13" fill="#4A5568">설치</text><text x="150" y="210" font-size="13" fill="#1A202C">Windows 구성 요소</text>
<text x="44" y="242" font-size="13" fill="#4A5568">갱신</text><text x="150" y="242" font-size="13" fill="#1A202C">Windows Update</text>
<text x="44" y="274" font-size="13" fill="#4A5568">플랫폼</text><text x="150" y="274" font-size="13" fill="#1A202C">Windows 전용</text>
<text x="44" y="316" font-size="13" fill="#4A5568">프로필·모듈 경로를 따로 봅니다</text>
<rect x="416" y="66" width="360" height="290" rx="10" fill="#fff" stroke="#2E2A56" stroke-width="3"/>
<text x="436" y="100" font-size="17" font-weight="700" fill="#2E2A56">pwsh.exe</text>
<text x="436" y="126" font-size="14" fill="#334155">PowerShell 7.6.5</text>
<line x1="436" y1="146" x2="756" y2="146" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="436" y="178" font-size="13" fill="#4A5568">런타임</text><text x="542" y="178" font-size="13" fill="#1A202C">.NET 10 LTS</text>
<text x="436" y="210" font-size="13" fill="#4A5568">설치</text><text x="542" y="210" font-size="13" fill="#1A202C">Program Files\PowerShell\7</text>
<text x="436" y="242" font-size="13" fill="#4A5568">갱신</text><text x="542" y="242" font-size="13" fill="#1A202C">별도 설치·갱신</text>
<text x="436" y="274" font-size="13" fill="#4A5568">플랫폼</text><text x="542" y="274" font-size="13" fill="#1A202C">Windows · macOS · Linux</text>
<text x="436" y="316" font-size="13" fill="#4A5568">5.1 을 대체하지 않습니다</text>
<text x="24" y="396" font-size="14" font-weight="700" fill="#2E2A56">작업 스케줄러가 powershell.exe 를 호출하고 있으면 7 을 설치해도 5.1 이 실행됩니다</text>
<text x="24" y="422" font-size="13" fill="#4A5568">호출 대상을 pwsh.exe 로 바꿔야 7 에서 돌아갑니다</text>
</g></svg>
