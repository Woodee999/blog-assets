<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="40" y="52" font-size="23" font-weight="700" fill="#1f2937">두 통제가 맡는 자리가 다릅니다</text>
  <text x="40" y="80" font-size="15" fill="#6b7280">하나는 메모리를 격리하고, 하나는 캐시를 만들지 않습니다</text>

  <rect x="50" y="112" width="340" height="300" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="74" y="146" font-size="18" font-weight="700" fill="#1f2937">Credential Guard</text>
  <text x="74" y="172" font-size="14" fill="#6b7280">단말 메모리를 격리</text>

  <text x="74" y="208" font-size="14" font-weight="700" fill="#1f2937">지킵니다</text>
  <text x="74" y="234" font-size="14" fill="#6b7280">NTLM 암호 해시</text>
  <text x="74" y="258" font-size="14" fill="#6b7280">Kerberos TGT</text>
  <text x="74" y="282" font-size="14" fill="#6b7280">앱이 저장한 도메인 자격 증명</text>

  <text x="74" y="322" font-size="14" font-weight="700" fill="#b91c1c">지키지 않습니다</text>
  <text x="74" y="348" font-size="14" fill="#6b7280">Active Directory 데이터베이스</text>
  <text x="74" y="372" font-size="14" fill="#6b7280">SAM (로컬 계정)</text>
  <text x="74" y="396" font-size="14" fill="#6b7280">호스트에서 오는 가상 머신 공격</text>

  <rect x="414" y="112" width="336" height="300" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="438" y="146" font-size="18" font-weight="700" fill="#1f2937">Protected Users</text>
  <text x="438" y="172" font-size="14" fill="#6b7280">계정 단위로 캐시 생성을 차단</text>

  <text x="438" y="208" font-size="14" font-weight="700" fill="#1f2937">클라이언트 쪽</text>
  <text x="438" y="234" font-size="14" fill="#b91c1c">NTOWF 캐시 안 함</text>
  <text x="438" y="258" font-size="14" fill="#6b7280">CredSSP · Windows Digest 평문 없음</text>
  <text x="438" y="282" font-size="14" fill="#6b7280">TGT 자동 재취득 없음</text>

  <text x="438" y="322" font-size="14" font-weight="700" fill="#1f2937">도메인 컨트롤러 쪽</text>
  <text x="438" y="348" font-size="14" fill="#6b7280">NTLM 인증 불가</text>
  <text x="438" y="372" font-size="14" fill="#6b7280">사전 인증에 DES · RC4 불가</text>
  <text x="438" y="396" font-size="14" fill="#6b7280">위임 제외 · TGT 4시간</text>

  <text x="50" y="438" font-size="14" fill="#9ca3af">출처: Microsoft Learn — Credential Guard overview / How to configure protected accounts</text>
</svg>
