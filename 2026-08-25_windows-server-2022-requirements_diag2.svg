<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Windows Server 2022 지원 수명 주기 타임라인">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="30" y="40" font-size="20" font-weight="700" fill="#1A202C">Windows Server 2022 지원 수명 주기</text>

    <text x="405" y="118" font-size="14" font-weight="700" fill="#243B55" text-anchor="middle">현재 · 2026년 8월</text>
    <line x1="405" y1="130" x2="405" y2="196" stroke="#243B55" stroke-width="2" stroke-dasharray="5 4"/>

    <rect x="100" y="200" width="315" height="34" fill="#243B55"/>
    <rect x="415" y="200" width="305" height="34" fill="#CBD5E1"/>

    <text x="257" y="223" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">주 지원</text>
    <text x="567" y="223" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">연장 지원 · 보안 업데이트만</text>

    <line x1="100" y1="240" x2="100" y2="266" stroke="#4A5568" stroke-width="2"/>
    <line x1="415" y1="240" x2="415" y2="266" stroke="#4A5568" stroke-width="2"/>
    <line x1="720" y1="240" x2="720" y2="266" stroke="#4A5568" stroke-width="2"/>

    <text x="100" y="290" font-size="14" font-weight="700" fill="#1A202C" text-anchor="middle">2021-08-18</text>
    <text x="100" y="312" font-size="13" fill="#4A5568" text-anchor="middle">출시</text>

    <text x="415" y="290" font-size="14" font-weight="700" fill="#1A202C" text-anchor="middle">2026-10-13</text>
    <text x="415" y="312" font-size="13" fill="#4A5568" text-anchor="middle">주 지원 종료</text>

    <text x="720" y="290" font-size="14" font-weight="700" fill="#1A202C" text-anchor="end">2031-10-14</text>
    <text x="720" y="312" font-size="13" fill="#4A5568" text-anchor="end">연장 지원 종료</text>

    <rect x="30" y="350" width="740" height="72" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="50" y="380" font-size="14" fill="#1A202C">· 주 지원 종료 후에는 기능 개선과 비보안 수정이 중단됩니다</text>
    <text x="50" y="406" font-size="14" fill="#1A202C">· 신규 구축은 2025 기준, 2022는 호환성 제약이 있는 경우로 한정</text>
  </g>
</svg>
