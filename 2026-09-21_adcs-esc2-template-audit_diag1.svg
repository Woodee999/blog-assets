<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect x="0" y="0" width="800" height="450" fill="#ffffff"/><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#374151"/></marker></defs><g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
<text x="40" y="36" font-size="20" font-weight="700" fill="#111827">ESC1과 ESC2 — 갈라지는 곳은 두 줄</text>
<rect x="40" y="64" width="720" height="86" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="400" y="90" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">공통 조건 넷 — 둘 다 필요</text>
<text x="70" y="116" font-size="12" fill="#4B5563">① 저권한 사용자에게 등록 권한</text>
<text x="420" y="116" font-size="12" fill="#4B5563">② 관리자 승인 없음</text>
<text x="70" y="138" font-size="12" fill="#4B5563">③ 권한 있는 서명 요구 없음</text>
<text x="420" y="138" font-size="12" fill="#4B5563">④ 과도한 템플릿 보안 설명자</text>
<line x1="220" y1="150" x2="220" y2="176" stroke="#374151" stroke-width="2" marker-end="url(#m)"/>
<line x1="580" y1="150" x2="580" y2="176" stroke="#374151" stroke-width="2" marker-end="url(#m)"/>
<rect x="40" y="182" width="350" height="132" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<rect x="40" y="182" width="350" height="30" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="215" y="203" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">ESC1</text>
<text x="62" y="234" font-size="13" fill="#111827">EKU — 인증용 EKU</text>
<text x="62" y="258" font-size="13" font-weight="700" fill="#111827">요청자가 주체 지정 — 필요</text>
<line x1="62" y1="272" x2="366" y2="272" stroke="#E5E7EB" stroke-width="1"/>
<text x="62" y="296" font-size="13" font-weight="700" fill="#C0392B">핵심 — 다른 사람 행세</text>
<rect x="410" y="182" width="350" height="132" rx="8" fill="#ffffff" stroke="#C0392B" stroke-width="2"/>
<rect x="410" y="182" width="350" height="30" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
<text x="585" y="203" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">ESC2</text>
<text x="432" y="234" font-size="13" font-weight="700" fill="#C0392B">EKU — Any Purpose 또는 없음</text>
<text x="432" y="258" font-size="13" fill="#4B5563">요청자가 주체 지정 — 불필요</text>
<line x1="432" y1="272" x2="736" y2="272" stroke="#E5E7EB" stroke-width="1"/>
<text x="432" y="296" font-size="13" font-weight="700" fill="#C0392B">핵심 — 용도 제한이 없음</text>
<line x1="40" y1="342" x2="760" y2="342" stroke="#E5E7EB" stroke-width="1"/>
<text x="40" y="368" font-size="13" fill="#6B7280">ESC1 대책인 「요청 시 주체 지정 해제」는 ESC2에 효과가 없습니다 — 그 조건이 필요하지 않습니다.</text>
<text x="40" y="392" font-size="13" fill="#6B7280">ESC1은 주체 지정에서, ESC2는 EKU에서 출발합니다. 같은 목록을 조건을 달리해 두 번 훑습니다.</text>
<text x="40" y="424" font-size="13" fill="#6B7280">Any Purpose = 2.5.29.37.0 · EKU 없음 = pKIExtendedKeyUsage 미설정</text>
</g></svg>
