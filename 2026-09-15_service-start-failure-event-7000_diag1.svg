<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs><marker id="s1" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#374151"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="40" y="36" font-size="20" font-weight="700" fill="#111827">서비스 시작 단계와 실패 시 남는 이벤트</text>

    <rect x="40" y="72" width="150" height="58" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <text x="115" y="97" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">1. 종속성 확인</text>
    <text x="115" y="118" font-size="11" fill="#6B7280" text-anchor="middle">먼저 시작할 서비스</text>
    <line x1="194" y1="101" x2="226" y2="101" stroke="#374151" stroke-width="2" marker-end="url(#s1)"/>

    <rect x="232" y="72" width="150" height="58" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <text x="307" y="97" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">2. 계정 로그온</text>
    <text x="307" y="118" font-size="11" fill="#6B7280" text-anchor="middle">실행 계정 인증</text>
    <line x1="386" y1="101" x2="418" y2="101" stroke="#374151" stroke-width="2" marker-end="url(#s1)"/>

    <rect x="424" y="72" width="150" height="58" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <text x="499" y="97" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">3. 프로세스 실행</text>
    <text x="499" y="118" font-size="11" fill="#6B7280" text-anchor="middle">PathName 경로</text>
    <line x1="578" y1="101" x2="610" y2="101" stroke="#374151" stroke-width="2" marker-end="url(#s1)"/>

    <rect x="616" y="72" width="150" height="58" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <text x="691" y="97" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">4. 시작 완료 보고</text>
    <text x="691" y="118" font-size="11" fill="#6B7280" text-anchor="middle">제한 시간 안에</text>

    <line x1="115" y1="134" x2="115" y2="176" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="307" y1="134" x2="307" y2="176" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="499" y1="134" x2="499" y2="176" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="691" y1="134" x2="691" y2="176" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 4"/>

    <rect x="40" y="182" width="150" height="96" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <text x="115" y="208" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">7001 · 7002</text>
    <text x="115" y="230" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">7003</text>
    <text x="115" y="256" font-size="11" fill="#4B5563" text-anchor="middle">원인은 다른 서비스</text>

    <rect x="232" y="182" width="150" height="96" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <text x="307" y="208" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">7038 · 7041</text>
    <text x="307" y="234" font-size="11" fill="#4B5563" text-anchor="middle">암호 변경 또는</text>
    <text x="307" y="256" font-size="11" fill="#4B5563" text-anchor="middle">서비스로 로그온 권한</text>

    <rect x="424" y="182" width="150" height="96" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <text x="499" y="208" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">7000</text>
    <text x="499" y="234" font-size="11" fill="#4B5563" text-anchor="middle">오류 코드 확인</text>
    <text x="499" y="256" font-size="11" fill="#4B5563" text-anchor="middle">경로 · 파일 존재 여부</text>

    <rect x="616" y="182" width="150" height="96" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <text x="691" y="208" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">7022</text>
    <text x="691" y="234" font-size="11" fill="#4B5563" text-anchor="middle">시작은 됐으나</text>
    <text x="691" y="256" font-size="11" fill="#4B5563" text-anchor="middle">응답이 없음</text>

    <line x1="40" y1="316" x2="760" y2="316" stroke="#E5E7EB" stroke-width="1"/>
    <text x="40" y="342" font-size="13" fill="#6B7280">모두 시스템 로그의 서비스 제어 관리자(Service Control Manager) 이벤트입니다. 보안 로그가 아닙니다.</text>
    <text x="40" y="366" font-size="13" fill="#6B7280">7000 옆에 어떤 번호가 함께 찍혔는지가 조사 방향을 정합니다.</text>
    <text x="40" y="390" font-size="13" fill="#6B7280">시작 유형이 사용 안 함이거나 아예 시도되지 않은 경우에는 7000도 남지 않습니다.</text>
    <text x="40" y="414" font-size="13" fill="#6B7280">이벤트가 없다고 정상이라고 볼 수 없는 이유입니다.</text>
  </g>
</svg>
