<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs><marker id="m7" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#374151"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="40" y="36" font-size="20" font-weight="700" fill="#111827">파이프라인 입력이 파라미터에 붙는 순서</text>

    <rect x="270" y="66" width="260" height="52" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <text x="400" y="97" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">객체 하나가 넘어옴</text>

    <line x1="400" y1="122" x2="400" y2="146" stroke="#374151" stroke-width="2" marker-end="url(#m7)"/>

    <rect x="230" y="152" width="340" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="400" y="176" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">① ByValue — 형식이 맞는가?</text>
    <text x="400" y="197" font-size="11" fill="#4B5563" text-anchor="middle">파라미터가 받는 형식이거나 변환 가능한가</text>

    <line x1="574" y1="180" x2="640" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#m7)"/>
    <text x="607" y="170" font-size="12" fill="#374151">예</text>
    <rect x="646" y="152" width="114" height="56" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="2"/>
    <text x="703" y="186" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">연결됨</text>

    <line x1="400" y1="212" x2="400" y2="236" stroke="#374151" stroke-width="2" marker-end="url(#m7)"/>
    <text x="416" y="230" font-size="12" fill="#6B7280">아니오</text>

    <rect x="230" y="242" width="340" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="400" y="266" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">② ByPropertyName — 이름이 같은가?</text>
    <text x="400" y="287" font-size="11" fill="#4B5563" text-anchor="middle">파라미터 이름과 같은 속성이 객체에 있는가</text>

    <line x1="574" y1="270" x2="640" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#m7)"/>
    <text x="607" y="260" font-size="12" fill="#374151">예</text>
    <rect x="646" y="242" width="114" height="56" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="2"/>
    <text x="703" y="276" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">연결됨</text>

    <line x1="400" y1="302" x2="400" y2="326" stroke="#374151" stroke-width="2" marker-end="url(#m7)"/>
    <text x="416" y="320" font-size="12" fill="#6B7280">아니오</text>

    <rect x="230" y="332" width="340" height="62" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
    <text x="400" y="357" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">우회 — 이름을 맞추거나 직접 넘김</text>
    <text x="400" y="380" font-size="11" fill="#4B5563" text-anchor="middle">Select-Object 계산된 속성 · ForEach-Object</text>

    <text x="40" y="424" font-size="13" fill="#6B7280">어느 파라미터에 붙일지는 지정할 수 없습니다 — 안 붙으면 고집하지 말고 우회합니다.</text>
  </g>
</svg>
