<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Server Core 선택 결정 흐름도">
<rect width="800" height="450" fill="#fff"/>
<defs><marker id="c1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4A5568"/></marker></defs>
<g font-family="system-ui,-apple-system,'Malgun Gothic',sans-serif">
<text x="24" y="34" font-size="20" font-weight="700" fill="#1A202C">설치 옵션 결정 흐름</text>
<rect x="24" y="60" width="330" height="58" rx="8" fill="#fff" stroke="#243B55" stroke-width="2.5"/>
<text x="44" y="86" font-size="15" font-weight="700" fill="#1A202C">Q1. 벤더가 GUI 설치 관리자만</text>
<text x="44" y="108" font-size="15" font-weight="700" fill="#1A202C">      제공하는가</text>
<rect x="24" y="150" width="330" height="58" rx="8" fill="#fff" stroke="#243B55" stroke-width="2.5"/>
<text x="44" y="176" font-size="15" font-weight="700" fill="#1A202C">Q2. 데스크톱 셸 구성 요소에</text>
<text x="44" y="198" font-size="15" font-weight="700" fill="#1A202C">      의존하는가</text>
<rect x="24" y="240" width="330" height="58" rx="8" fill="#fff" stroke="#243B55" stroke-width="2.5"/>
<text x="44" y="266" font-size="15" font-weight="700" fill="#1A202C">Q3. 벤더가 Server Core 지원을</text>
<text x="44" y="288" font-size="15" font-weight="700" fill="#1A202C">      명시하는가</text>
<line x1="189" y1="118" x2="189" y2="148" stroke="#4A5568" stroke-width="2" marker-end="url(#c1)"/>
<line x1="189" y1="208" x2="189" y2="238" stroke="#4A5568" stroke-width="2" marker-end="url(#c1)"/>
<line x1="189" y1="298" x2="189" y2="330" stroke="#4A5568" stroke-width="2" marker-end="url(#c1)"/>
<text x="200" y="140" font-size="12" fill="#64748B">아니오</text>
<text x="200" y="230" font-size="12" fill="#64748B">아니오</text>
<text x="200" y="320" font-size="12" fill="#64748B">예</text>
<rect x="410" y="60" width="366" height="238" rx="10" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="430" y="92" font-size="16" font-weight="700" fill="#475569">데스크톱 환경</text>
<text x="430" y="126" font-size="14" fill="#1A202C">셋 중 하나라도 걸리면 이쪽입니다</text>
<text x="430" y="158" font-size="13" fill="#4A5568">GUI 마법사가 필요한 설치·인증</text>
<text x="430" y="184" font-size="13" fill="#4A5568">.NET Framework 전체 버전 요구</text>
<text x="430" y="210" font-size="13" fill="#4A5568">무인 설치 스위치 미제공</text>
<text x="430" y="248" font-size="13" fill="#4A5568">설치가 되더라도 패치·버전 업마다</text>
<text x="430" y="272" font-size="13" fill="#4A5568">같은 문제를 다시 겪습니다</text>
<rect x="24" y="330" width="752" height="58" rx="8" fill="#fff" stroke="#243B55" stroke-width="2.5"/>
<text x="44" y="356" font-size="15" font-weight="700" fill="#243B55">Server Core — 노출면과 재부팅 횟수가 줄어듭니다</text>
<text x="44" y="378" font-size="13" fill="#4A5568">도메인 컨트롤러 · DNS · DHCP · 파일 서버 · Hyper-V 호스트에 적합</text>
<text x="24" y="424" font-size="14" font-weight="700" fill="#243B55">설치 후 전환이 불가능하므로 발주 단계에서 확정합니다</text>
</g></svg>
