<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="이벤트 7031을 발견한 뒤 시각 기준으로 로그를 모아 원인 후보를 좁혀 가는 조사 순서도">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">

    <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">7031을 본 다음의 조사 순서</text>

    <rect x="280" y="56" width="240" height="44" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="400" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">7031 발견 — 시각과 횟수 확보</text>
    <path d="M400 100 L400 122" stroke="#1f2937" stroke-width="2" marker-end="url(#f1)"/>

    <rect x="240" y="126" width="320" height="48" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="400" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">같은 시각 7024 가 있는가</text>
    <text x="400" y="166" text-anchor="middle" font-size="11.5" fill="#6b7280">서비스가 스스로 남긴 종료 코드</text>

    <path d="M560 150 L640 150" stroke="#b91c1c" stroke-width="2" marker-end="url(#f2)"/>
    <text x="600" y="142" text-anchor="middle" font-size="11" fill="#b91c1c">있음</text>
    <rect x="644" y="128" width="130" height="44" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <text x="709" y="148" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">그 코드부터</text>
    <text x="709" y="164" text-anchor="middle" font-size="11" fill="#6b7280">원인에 가장 가까움</text>

    <path d="M400 174 L400 196" stroke="#1f2937" stroke-width="2" marker-end="url(#f1)"/>
    <text x="420" y="190" font-size="11" fill="#6b7280">없음</text>

    <rect x="200" y="200" width="400" height="48" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
    <text x="400" y="222" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">그 시각 앞뒤 2분 — System + Application 을 시간순으로</text>
    <text x="400" y="240" text-anchor="middle" font-size="11.5" fill="#6b7280">짝이 되는 이벤트를 찾는 단계</text>

    <path d="M400 248 L400 268" stroke="#1f2937" stroke-width="2"/>
    <path d="M150 268 L650 268" stroke="#1f2937" stroke-width="2"/>
    <path d="M150 268 L150 292" stroke="#1f2937" stroke-width="2" marker-end="url(#f1)"/>
    <path d="M400 268 L400 292" stroke="#1f2937" stroke-width="2" marker-end="url(#f1)"/>
    <path d="M650 268 L650 292" stroke="#9ca3af" stroke-width="2" marker-end="url(#f3)"/>

    <rect x="40" y="296" width="220" height="104" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="150" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">1000 / 1026 이 있음</text>
    <text x="58" y="346" font-size="12" fill="#1f2937">오류 모듈 이름 확인</text>
    <text x="58" y="368" font-size="11.5" fill="#6b7280">서비스 실행 파일 → 제품 문제</text>
    <text x="58" y="388" font-size="11.5" fill="#6b7280">다른 DLL → 구성 요소·드라이버</text>

    <rect x="290" y="296" width="220" height="104" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="400" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">자원·업데이트 이벤트</text>
    <text x="308" y="346" font-size="12" fill="#1f2937">디스크·저장소 경고</text>
    <text x="308" y="368" font-size="12" fill="#1f2937">같은 시각 패치 적용</text>
    <text x="308" y="388" font-size="11.5" fill="#6b7280">알려진 문제 목록 먼저 확인</text>

    <rect x="540" y="296" width="220" height="104" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="650" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280">짝이 없음</text>
    <text x="558" y="346" font-size="12" fill="#1f2937">시간 창을 앞으로 더 벌린다</text>
    <text x="558" y="368" font-size="12" fill="#1f2937">제품 자체 로그를 찾는다</text>
    <text x="558" y="388" font-size="11.5" fill="#6b7280">백업 에이전트 · DB 등</text>

    <text x="40" y="430" font-size="11.5" fill="#6b7280">복구 설정 변경은 원인을 찾은 다음입니다. 자동 재시작을 끄면 증상은 드러나지만 업무가 멈춥니다.</text>
  </g>
  <defs>
    <marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
