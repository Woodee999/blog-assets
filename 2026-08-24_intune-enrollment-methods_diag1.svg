<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Intune 등록 방법 선택 결정 흐름도">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4A5568"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="30" y="34" font-size="20" font-weight="700" fill="#1A202C">Intune 등록 방법 선택 흐름</text>

    <rect x="30" y="60" width="300" height="60" rx="8" fill="#ffffff" stroke="#1F4E5F" stroke-width="2.5"/>
    <text x="48" y="88" font-size="15" font-weight="700" fill="#1A202C">Q1. Entra 하이브리드 조인이</text>
    <text x="48" y="108" font-size="15" font-weight="700" fill="#1A202C">      필요한가</text>

    <rect x="30" y="160" width="300" height="60" rx="8" fill="#ffffff" stroke="#1F4E5F" stroke-width="2.5"/>
    <text x="48" y="188" font-size="15" font-weight="700" fill="#1A202C">Q2. 장비를 사용자에게</text>
    <text x="48" y="208" font-size="15" font-weight="700" fill="#1A202C">      직접 배송하는가</text>

    <rect x="30" y="260" width="300" height="60" rx="8" fill="#ffffff" stroke="#1F4E5F" stroke-width="2.5"/>
    <text x="48" y="288" font-size="15" font-weight="700" fill="#1A202C">Q3. Windows 10 혼재 또는</text>
    <text x="48" y="308" font-size="15" font-weight="700" fill="#1A202C">      사전 프로비저닝 필요</text>

    <line x1="180" y1="120" x2="180" y2="158" stroke="#4A5568" stroke-width="2" marker-end="url(#a1)"/>
    <line x1="180" y1="220" x2="180" y2="258" stroke="#4A5568" stroke-width="2" marker-end="url(#a1)"/>
    <text x="192" y="145" font-size="12" fill="#64748B">아니오</text>
    <text x="192" y="245" font-size="12" fill="#64748B">예</text>

    <rect x="420" y="60" width="350" height="60" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="438" y="88" font-size="14" fill="#1A202C">Windows Autopilot</text>
    <text x="438" y="108" font-size="13" fill="#4A5568">기존 도메인 장비는 그룹 정책 · 공동 관리</text>

    <rect x="420" y="160" width="350" height="60" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="438" y="188" font-size="14" fill="#1A202C">대량 등록(프로비저닝 패키지)</text>
    <text x="438" y="208" font-size="13" fill="#4A5568">사내 입고 후 관리자가 일괄 개통</text>

    <rect x="420" y="260" width="350" height="60" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="438" y="288" font-size="14" fill="#1A202C">예 → Windows Autopilot</text>
    <text x="438" y="308" font-size="14" fill="#1A202C">아니오 → Autopilot 장치 준비</text>

    <line x1="334" y1="90" x2="416" y2="90" stroke="#94A3B8" stroke-width="2" marker-end="url(#a1)"/>
    <line x1="334" y1="190" x2="416" y2="190" stroke="#94A3B8" stroke-width="2" marker-end="url(#a1)"/>
    <line x1="334" y1="290" x2="416" y2="290" stroke="#94A3B8" stroke-width="2" marker-end="url(#a1)"/>
    <text x="352" y="84" font-size="12" fill="#64748B">예</text>
    <text x="352" y="184" font-size="12" fill="#64748B">아니오</text>

    <rect x="30" y="360" width="740" height="60" rx="8" fill="#ffffff" stroke="#1F4E5F" stroke-width="2.5"/>
    <text x="50" y="388" font-size="15" font-weight="700" fill="#1F4E5F">모든 경로의 전제 조건</text>
    <text x="50" y="410" font-size="14" fill="#1A202C">Entra ID 자동 등록(MDM 사용자 범위) 설정 + Entra ID P1 또는 P2 라이선스</text>
  </g>
</svg>
