<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect x="0" y="0" width="800" height="450" fill="#ffffff"/><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#374151"/></marker></defs><g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
<text x="40" y="36" font-size="20" font-weight="700" fill="#111827">4624 로그온 유형 — 무엇의 증적이 되는가</text>
<rect x="40" y="62" width="230" height="120" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<rect x="40" y="62" width="230" height="30" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="155" y="83" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">2.6.2 정보시스템 접근</text>
<text x="62" y="116" font-size="13" fill="#111827">유형 2 — 콘솔 직접 로그온</text>
<text x="62" y="142" font-size="13" fill="#111827">유형 3 — 네트워크 접근</text>
<text x="62" y="168" font-size="13" fill="#111827">유형 7 — 잠금 해제</text>
<rect x="285" y="62" width="230" height="120" rx="8" fill="#ffffff" stroke="#C0392B" stroke-width="2"/>
<rect x="285" y="62" width="230" height="30" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
<text x="400" y="83" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">2.6.6 원격접근 통제</text>
<text x="307" y="116" font-size="13" font-weight="700" fill="#C0392B">유형 10 — 원격 데스크톱</text>
<text x="307" y="142" font-size="12" fill="#4B5563">출발지 주소를 함께 봄</text>
<text x="307" y="166" font-size="12" fill="#4B5563">승인 대장과 대조하면 증적</text>
<rect x="530" y="62" width="230" height="120" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<rect x="530" y="62" width="230" height="30" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="645" y="83" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">따로 봐야 하는 유형</text>
<text x="552" y="116" font-size="13" font-weight="700" fill="#C0392B">유형 11 — 캐시 자격 증명</text>
<text x="552" y="138" font-size="12" fill="#4B5563">DC에 확인하지 않음</text>
<text x="552" y="164" font-size="13" fill="#111827">유형 8 — 해시되지 않은 전달</text>
<rect x="40" y="204" width="720" height="60" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="62" y="230" font-size="14" font-weight="700" fill="#111827">감사 정책이 먼저 — Logon / Special Logon / Other Logon-Logoff</text>
<text x="62" y="253" font-size="12" fill="#4B5563">고급 감사 정책을 쓰면 「하위 범주 설정이 범주 설정을 재정의하도록 강제」를 반드시 함께 사용</text>
<line x1="40" y1="296" x2="760" y2="296" stroke="#E5E7EB" stroke-width="1"/>
<text x="40" y="322" font-size="13" fill="#6B7280">유형 4·5는 예약 작업과 서비스라 양이 많습니다. 수집 단계에서 유형으로 거르면 크게 줄어듭니다.</text>
<text x="40" y="346" font-size="13" fill="#6B7280">로그오프 이벤트(4634·4647)는 100% 신뢰할 수 없습니다 — 정상 종료 없이 꺼지면 남지 않습니다.</text>
<text x="40" y="378" font-size="13" fill="#6B7280">세션 종료 시각을 로그오프 기록만으로 산정하지 마십시오.</text>
</g></svg>
