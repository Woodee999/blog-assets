<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Intune 등록 실패 진단 순서">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4A5568"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="30" y="36" font-size="20" font-weight="700" fill="#1A202C">등록 실패 진단 순서</text>

    <rect x="30" y="70" width="230" height="150" rx="8" fill="#ffffff" stroke="#1F4E5F" stroke-width="2.5"/>
    <text x="48" y="100" font-size="15" font-weight="700" fill="#1F4E5F">1단계 · 조인 상태</text>
    <text x="48" y="128" font-size="13" fill="#1A202C">dsregcmd /status</text>
    <text x="48" y="156" font-size="13" fill="#4A5568">AzureAdJoined</text>
    <text x="48" y="178" font-size="13" fill="#4A5568">DomainJoined</text>
    <text x="48" y="200" font-size="13" fill="#4A5568">MdmUrl 값 존재 여부</text>

    <rect x="285" y="70" width="230" height="150" rx="8" fill="#ffffff" stroke="#1F4E5F" stroke-width="2.5"/>
    <text x="303" y="100" font-size="15" font-weight="700" fill="#1F4E5F">2단계 · 이벤트 로그</text>
    <text x="303" y="128" font-size="13" fill="#1A202C">이벤트 뷰어</text>
    <text x="303" y="156" font-size="13" fill="#4A5568">DeviceManagement-</text>
    <text x="303" y="178" font-size="13" fill="#4A5568">Enterprise-Diagnostic-</text>
    <text x="303" y="200" font-size="13" fill="#4A5568">Provider &gt; Admin</text>

    <rect x="540" y="70" width="230" height="150" rx="8" fill="#ffffff" stroke="#1F4E5F" stroke-width="2.5"/>
    <text x="558" y="100" font-size="15" font-weight="700" fill="#1F4E5F">3단계 · 진단 수집</text>
    <text x="558" y="128" font-size="13" fill="#1A202C">mdmdiagnosticstool.exe</text>
    <text x="558" y="156" font-size="13" fill="#4A5568">-area DeviceEnrollment</text>
    <text x="558" y="178" font-size="13" fill="#4A5568">-zip MDMDiagReport.zip</text>
    <text x="558" y="200" font-size="13" fill="#4A5568">GUI: 보고서 만들기</text>

    <line x1="264" y1="145" x2="281" y2="145" stroke="#4A5568" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="519" y1="145" x2="536" y2="145" stroke="#4A5568" stroke-width="2" marker-end="url(#a2)"/>

    <rect x="30" y="265" width="740" height="140" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="50" y="297" font-size="15" font-weight="700" fill="#1A202C">단계별 판정</text>
    <text x="50" y="327" font-size="14" fill="#1A202C">· AzureAdJoined 가 NO → 조인 자체가 실패. 사용자 계정과 조인 정책부터 확인</text>
    <text x="50" y="355" font-size="14" fill="#1A202C">· 조인은 YES 인데 MdmUrl 이 비어 있음 → MDM 사용자 범위 또는 라이선스 미할당</text>
    <text x="50" y="383" font-size="14" fill="#1A202C">· 둘 다 정상인데 정책 미적용 → Admin 로그의 오류 코드로 원인 특정</text>
  </g>
</svg>
