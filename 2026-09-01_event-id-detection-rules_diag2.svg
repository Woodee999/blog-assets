    <text x="510" y="320" font-size="12" fill="#4B5563" text-anchor="middle">알림 발생 · 조사</text>

    <line x1="426" y1="303" x2="384" y2="303" stroke="#374151" stroke-width="2" marker-end="url(#a4)"/>

    <rect x="210" y="272" width="170" height="62" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="295" y="298" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">4. 오탐 원인 분류</text>
    <text x="295" y="320" font-size="12" fill="#4B5563" text-anchor="middle">예정 · 구성 · 범위</text>

