<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="40" y="38" font-size="20" font-weight="700" fill="#111827">탐지 규칙 튜닝 순환</text>

    <rect x="250" y="70" width="300" height="62" rx="8" fill="#EEF2FF" stroke="#4338CA" stroke-width="2"/>
    <text x="400" y="96" font-size="15" font-weight="700" fill="#4338CA" text-anchor="middle">1. 기준선 측정 (알림 없이 2주)</text>
    <text x="400" y="119" font-size="12" fill="#4B5563" text-anchor="middle">계정 유형별로 분리해 집계</text>

    <line x1="552" y1="101" x2="620" y2="101" stroke="#374151" stroke-width="2"/>
    <line x1="620" y1="101" x2="620" y2="192" stroke="#374151" stroke-width="2"/>
    <line x1="620" y1="192" x2="592" y2="192" stroke="#374151" stroke-width="2" marker-end="url(#a4)"/>

    <rect x="430" y="162" width="160" height="62" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="510" y="188" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">2. 임계값 설정</text>
    <text x="510" y="210" font-size="12" fill="#4B5563" text-anchor="middle">상위 1% 지점 기준</text>

    <line x1="510" y1="228" x2="510" y2="266" stroke="#374151" stroke-width="2" marker-end="url(#a4)"/>

    <rect x="430" y="272" width="160" height="62" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
