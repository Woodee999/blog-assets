<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Windows 11 업그레이드 자격 판정 순서도">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4A5568"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="30" y="34" font-size="20" font-weight="700" fill="#1A202C">Windows 11 업그레이드 자격 판정 순서</text>

    <rect x="30" y="58" width="250" height="56" rx="8" fill="#ffffff" stroke="#2C5364" stroke-width="2.5"/>
    <text x="46" y="83" font-size="15" font-weight="700" fill="#1A202C">1. TPM 사양 버전 2.0</text>
    <text x="46" y="103" font-size="13" fill="#4A5568">tpm.msc / Get-Tpm</text>

    <rect x="30" y="150" width="250" height="56" rx="8" fill="#ffffff" stroke="#2C5364" stroke-width="2.5"/>
    <text x="46" y="175" font-size="15" font-weight="700" fill="#1A202C">2. Secure Boot 사용</text>
    <text x="46" y="195" font-size="13" fill="#4A5568">Confirm-SecureBootUEFI</text>

    <rect x="30" y="242" width="250" height="56" rx="8" fill="#ffffff" stroke="#2C5364" stroke-width="2.5"/>
    <text x="46" y="267" font-size="15" font-weight="700" fill="#1A202C">3. 시스템 디스크 GPT</text>
    <text x="46" y="287" font-size="13" fill="#4A5568">Get-Disk</text>

    <rect x="30" y="334" width="250" height="56" rx="8" fill="#ffffff" stroke="#2C5364" stroke-width="2.5"/>
    <text x="46" y="359" font-size="15" font-weight="700" fill="#1A202C">4. CPU 지원 목록 포함</text>
    <text x="46" y="379" font-size="13" fill="#4A5568">msinfo32</text>

    <line x1="155" y1="114" x2="155" y2="148" stroke="#4A5568" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="155" y1="206" x2="155" y2="240" stroke="#4A5568" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="155" y1="298" x2="155" y2="332" stroke="#4A5568" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="420" y="58" width="350" height="56" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="438" y="92" font-size="14" fill="#1A202C">펌웨어에서 Intel PTT / AMD fTPM 활성화</text>

    <rect x="420" y="150" width="350" height="56" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="438" y="184" font-size="14" fill="#1A202C">CSM 해제 후 UEFI 부팅으로 전환</text>

    <rect x="420" y="242" width="350" height="56" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="438" y="276" font-size="14" fill="#1A202C">mbr2gpt /validate → /convert 후 펌웨어 전환</text>

    <rect x="420" y="334" width="350" height="56" rx="8" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="438" y="368" font-size="14" fill="#1A202C">우회 설치 대신 장비 교체 계획으로 처리</text>

    <line x1="284" y1="86" x2="416" y2="86" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="284" y1="178" x2="416" y2="178" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="284" y1="270" x2="416" y2="270" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="284" y1="362" x2="416" y2="362" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>

    <text x="318" y="80" font-size="12" fill="#64748B">불충족</text>
    <text x="318" y="172" font-size="12" fill="#64748B">불충족</text>
    <text x="318" y="264" font-size="12" fill="#64748B">불충족</text>
    <text x="318" y="356" font-size="12" fill="#64748B">불충족</text>

    <text x="168" y="132" font-size="12" fill="#64748B">충족</text>
    <text x="168" y="224" font-size="12" fill="#64748B">충족</text>
    <text x="168" y="316" font-size="12" fill="#64748B">충족</text>

    <text x="30" y="424" font-size="14" font-weight="700" fill="#2C5364">네 항목을 모두 충족하면 업그레이드 경로가 열립니다</text>
  </g>
</svg>
