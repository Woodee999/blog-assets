<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"><rect x="0" y="0" width="800" height="450" fill="#ffffff"/><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#374151"/></marker></defs><g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
<text x="40" y="36" font-size="20" font-weight="700" fill="#111827">세 코드는 계층이 다릅니다</text>
<rect x="40" y="66" width="230" height="150" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<rect x="40" y="66" width="230" height="32" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="155" y="88" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">0x80070002</text>
<text x="62" y="122" font-size="12" fill="#4B5563">ERROR_FILE_NOT_FOUND</text>
<text x="62" y="152" font-size="16" font-weight="700" fill="#111827">없음</text>
<text x="62" y="180" font-size="12" fill="#4B5563">필요한 파일·레지스트리</text>
<text x="62" y="200" font-size="12" fill="#4B5563">항목이 존재하지 않음</text>
<rect x="285" y="66" width="230" height="150" rx="8" fill="#ffffff" stroke="#C0392B" stroke-width="2"/>
<rect x="285" y="66" width="230" height="32" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
<text x="400" y="88" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">0x800F0922</text>
<text x="307" y="122" font-size="12" fill="#4B5563">CBS_E_INSTALLERS_FAILED</text>
<text x="307" y="152" font-size="16" font-weight="700" fill="#C0392B">실행 실패</text>
<text x="307" y="180" font-size="12" fill="#4B5563">설치 단계까지 갔다가</text>
<text x="307" y="200" font-size="12" fill="#4B5563">거기서 실패</text>
<rect x="530" y="66" width="230" height="150" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<rect x="530" y="66" width="230" height="32" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
<text x="645" y="88" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">0x8007000D</text>
<text x="552" y="122" font-size="12" fill="#4B5563">ERROR_INVALID_DATA</text>
<text x="552" y="152" font-size="16" font-weight="700" fill="#111827">손상</text>
<text x="552" y="180" font-size="12" fill="#4B5563">설치는 되나 재시작 시</text>
<text x="552" y="200" font-size="12" fill="#4B5563">롤백됨</text>
<rect x="40" y="240" width="720" height="56" rx="8" fill="#F3F4F6" stroke="#C0392B" stroke-width="2"/>
<text x="400" y="264" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">0x800F0922 는 원인이 아니라 실패 지점을 알려줍니다</text>
<text x="400" y="286" font-size="12" fill="#4B5563" text-anchor="middle">디스크였는지 예약 작업이었는지 다른 무엇인지는 코드로 알 수 없습니다</text>
<line x1="40" y1="328" x2="760" y2="328" stroke="#E5E7EB" stroke-width="1"/>
<text x="40" y="354" font-size="13" fill="#6B7280">세 코드 모두 최종 판별은 CBS.log 에서 합니다. 코드만 보고 조치를 정하면 헛수고가 됩니다.</text>
<text x="40" y="378" font-size="13" fill="#6B7280">%windir%\Logs\CBS\CBS.log 에서 해당 문자열 주변 줄을 봅니다.</text>
<text x="40" y="410" font-size="13" fill="#6B7280">실패는 그 지점에서 보고될 뿐이고, 발생은 그 앞입니다.</text>
</g></svg>
