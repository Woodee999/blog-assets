<defs><marker id="k2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
<g font-family="system-ui,-apple-system,'Malgun Gothic',sans-serif">
