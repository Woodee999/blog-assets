<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="장애 상황별 쿼럼 투표 수 변화">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="24" y="34" font-size="20" font-weight="700" fill="#1A202C">장애 상황별 투표 수 변화 (2노드 + 감시)</text>

    <rect x="24" y="60" width="240" height="300" rx="10" fill="#ffffff" stroke="#28402F" stroke-width="2.5"/>
    <text x="44" y="92" font-size="15" font-weight="700" fill="#28402F">노드 1대 정지</text>
    <text x="44" y="132" font-size="14" fill="#94A3B8">노드 1 · 정지 (0표)</text>
    <text x="44" y="164" font-size="14" fill="#1A202C">노드 2 · 정상 (1표)</text>
    <text x="44" y="196" font-size="14" fill="#1A202C">감시 · 정상 (1표)</text>
    <line x1="44" y1="218" x2="244" y2="218" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="44" y="248" font-size="16" font-weight="700" fill="#1A202C">유효 2표 / 3표</text>
    <text x="44" y="286" font-size="13" fill="#4A5568">서비스 유지</text>
    <text x="44" y="310" font-size="13" fill="#4A5568">역할이 노드 2로 이동</text>

    <rect x="280" y="60" width="240" height="300" rx="10" fill="#ffffff" stroke="#28402F" stroke-width="2.5"/>
    <text x="300" y="92" font-size="15" font-weight="700" fill="#28402F">감시 손실</text>
    <text x="300" y="132" font-size="14" fill="#1A202C">노드 1 · 정상 (1표)</text>
    <text x="300" y="164" font-size="14" fill="#1A202C">노드 2 · 정상 (1표)</text>
    <text x="300" y="196" font-size="14" fill="#94A3B8">감시 · 손실 (투표 제외)</text>
    <line x1="300" y1="218" x2="500" y2="218" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="300" y="248" font-size="16" font-weight="700" fill="#1A202C">유효 2표 / 2표</text>
    <text x="300" y="286" font-size="13" fill="#4A5568">동적 쿼럼이 감시 투표를</text>
    <text x="300" y="308" font-size="13" fill="#4A5568">자동 제외해 유지</text>
    <text x="300" y="332" font-size="13" fill="#4A5568">감시는 재구성 필요</text>

    <rect x="536" y="60" width="240" height="300" rx="10" fill="#F7FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="556" y="92" font-size="15" font-weight="700" fill="#475569">노드 간 네트워크 분단</text>
    <text x="556" y="132" font-size="14" fill="#1A202C">노드 1 · 고립 (1표)</text>
    <text x="556" y="164" font-size="14" fill="#1A202C">노드 2 · 고립 (1표)</text>
    <text x="556" y="196" font-size="14" fill="#1A202C">감시 · 한쪽만 도달</text>
    <line x1="556" y1="218" x2="756" y2="218" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="556" y="248" font-size="16" font-weight="700" fill="#1A202C">감시 확보 측 2표</text>
    <text x="556" y="286" font-size="13" fill="#4A5568">감시에 도달한 노드가</text>
    <text x="556" y="308" font-size="13" fill="#4A5568">서비스를 유지하고</text>
    <text x="556" y="330" font-size="13" fill="#4A5568">반대편은 역할을 내려놓음</text>

    <text x="24" y="400" font-size="14" font-weight="700" fill="#28402F">노드 2대가 동시에 멈추면 유효 투표가 0이 되어 클러스터가 중단됩니다.</text>
    <text x="24" y="426" font-size="13" fill="#4A5568">이 경우에만 강제 쿼럼 시작 절차가 필요하며, 그 전에 원인부터 확인해야 합니다.</text>
  </g>
</svg>
