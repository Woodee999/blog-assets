<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="23" font-weight="700" fill="#1f2937">서비스 설치가 남는 두 경로</text>
  <text x="40" y="74" font-size="14" fill="#6b7280">같은 사건이지만 담기는 필드가 다릅니다</text>

  <!-- source -->
  <rect x="40" y="200" width="170" height="76" fill="#ffffff" stroke="#1f2937" stroke-width="2" rx="4"/>
  <text x="125" y="232" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">서비스 설치</text>
  <text x="125" y="256" font-size="13" fill="#6b7280" text-anchor="middle">서비스 제어 관리자</text>

  <!-- arrows -->
  <path d="M 212 226 L 268 226 L 268 150 L 318 150" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ah2)"/>
  <path d="M 212 250 L 268 250 L 268 328 L 318 328" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ah2)"/>

  <!-- branch 1 : 7045 -->
  <rect x="326" y="104" width="434" height="96" fill="#ffffff" stroke="#1f2937" stroke-width="2" rx="4"/>
  <text x="346" y="132" font-size="17" font-weight="700" fill="#1f2937">System 로그 · 7045</text>
  <text x="346" y="158" font-size="14" fill="#1f2937">서비스 이름 / 실행 파일 / 형식 / 시작 유형 / 서비스 계정</text>
  <text x="346" y="182" font-size="14" font-weight="700" fill="#b91c1c">설치한 계정 없음 · 감사 정책과 무관하게 기록</text>

  <!-- branch 2 : 4697 -->
  <rect x="326" y="282" width="434" height="96" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5" rx="4"/>
  <text x="346" y="310" font-size="17" font-weight="700" fill="#b91c1c">Security 로그 · 4697</text>
  <text x="346" y="336" font-size="14" fill="#1f2937">위 필드 + Subject(설치한 계정 SID · 이름 · 로그온 ID)</text>
  <text x="346" y="360" font-size="14" font-weight="700" fill="#b91c1c">보안 시스템 확장 감사(성공) 필요 · Server 2016 / Win10 이상</text>

  <line x1="40" y1="404" x2="760" y2="404" stroke="#6b7280" stroke-width="1"/>
  <text x="40" y="430" font-size="14" fill="#1f2937">7045는 무엇이 설치됐는지를, 4697은 누가 설치했는지를 담습니다.</text>
</svg>
