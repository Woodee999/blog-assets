<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text x="40" y="52" font-size="23" font-weight="700" fill="#1f2937">부팅 직후의 상호 대기</text>
  <text x="40" y="80" font-size="15" fill="#6b7280">DNS는 디렉터리가 열리기를, 복제는 이름이 풀리기를 기다립니다</text>

  <rect x="60" y="120" width="260" height="110" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="84" y="156" font-size="18" font-weight="700" fill="#1f2937">DNS 서버 서비스</text>
  <text x="84" y="186" font-size="14" fill="#6b7280">AD 통합 영역을 호스팅</text>
  <text x="84" y="210" font-size="14" fill="#6b7280">초기 동기화 완료를 대기</text>

  <rect x="480" y="120" width="260" height="110" rx="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="504" y="156" font-size="18" font-weight="700" fill="#1f2937">AD 수신 복제</text>
  <text x="504" y="186" font-size="14" fill="#6b7280">원본 DC의 CNAME GUID를</text>
  <text x="504" y="210" font-size="14" fill="#6b7280">IP로 풀어야 시작</text>

  <path d="M320 160 L470 160" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="340" y="148" font-size="14" font-weight="700" fill="#b91c1c">기다림</text>

  <path d="M480 200 L330 200" stroke="#b91c1c" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="352" y="222" font-size="14" font-weight="700" fill="#b91c1c">이름 확인 요청</text>

  <rect x="60" y="282" width="680" height="54" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="84" y="315" font-size="15" fill="#1f2937">기본 설정 DNS가 자기 자신뿐이면 두 화살표가 같은 서버를 가리켜 출구가 없습니다</text>

  <text x="60" y="382" font-size="15" font-weight="700" fill="#1f2937">결과</text>
  <text x="60" y="410" font-size="15" fill="#6b7280">이름 확인 실패 시 질의당 12초 · 파티션 5개 기준 850초(14분 이상)</text>
  <text x="60" y="434" font-size="14" fill="#9ca3af">출처: Microsoft Learn, Troubleshoot DNS Event ID 4013</text>
</svg>
