<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="심사에서 묻는 다섯 가지 질문과 각 질문에 대응하는 Windows 서버 설정 항목을 연결한 도식">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">

    <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">항목이 아니라 질문으로 묶습니다</text>

    <text x="180" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280">심사에서 묻는 것</text>
    <text x="580" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280">서버에서 보는 것</text>

    <rect x="28" y="74" width="304" height="52" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="46" y="106" font-size="13" fill="#1f2937">① 누가 이 서버에 들어올 수 있는가</text>
    <rect x="404" y="74" width="368" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="422" y="98" font-size="12.5" fill="#1f2937">계정 목록 · 관리자 그룹 · 암호·잠금 정책</text>
    <text x="422" y="118" font-size="11.5" fill="#6b7280">Get-LocalUser · Get-LocalGroupMember · secedit</text>
    <path d="M332 100 L400 100" stroke="#1f2937" stroke-width="2" marker-end="url(#k1)"/>

    <rect x="28" y="138" width="304" height="52" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="46" y="170" font-size="13" fill="#1f2937">② 어디서 들어올 수 있는가</text>
    <rect x="404" y="138" width="368" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="422" y="162" font-size="12.5" fill="#1f2937">방화벽 규칙 · 원격 접속 설정</text>
    <text x="422" y="182" font-size="11.5" fill="#6b7280">Get-NetFirewallProfile · RDP · NLA 레지스트리</text>
    <path d="M332 164 L400 164" stroke="#1f2937" stroke-width="2" marker-end="url(#k1)"/>

    <rect x="28" y="202" width="304" height="52" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="46" y="234" font-size="13" fill="#1f2937">③ 무엇이 기록되는가</text>
    <rect x="404" y="202" width="368" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="422" y="226" font-size="12.5" fill="#1f2937">감사 정책 · 로그 크기와 보존</text>
    <text x="422" y="246" font-size="11.5" fill="#6b7280">auditpol · Get-WinEvent -ListLog</text>
    <path d="M332 228 L400 228" stroke="#1f2937" stroke-width="2" marker-end="url(#k1)"/>

    <rect x="28" y="266" width="304" height="52" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="46" y="298" font-size="13" fill="#1f2937">④ 취약점은 언제 막았는가</text>
    <rect x="404" y="266" width="368" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="422" y="290" font-size="12.5" fill="#1f2937">빌드 번호 · 업데이트 적용 이력</text>
    <text x="422" y="310" font-size="11.5" fill="#6b7280">CurrentBuild · UBR · Get-HotFix</text>
    <path d="M332 292 L400 292" stroke="#1f2937" stroke-width="2" marker-end="url(#k1)"/>

    <rect x="28" y="330" width="304" height="52" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="46" y="362" font-size="13" fill="#1f2937">⑤ 필요 없는 것은 꺼져 있는가</text>
    <rect x="404" y="330" width="368" height="52" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="422" y="354" font-size="12.5" fill="#1f2937">서비스 · 공유 · 계정</text>
    <text x="422" y="374" font-size="11.5" fill="#6b7280">Get-Service · Get-SmbShare</text>
    <path d="M332 356 L400 356" stroke="#1f2937" stroke-width="2" marker-end="url(#k1)"/>

    <rect x="28" y="394" width="744" height="40" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="400" y="419" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">한 대에 십 분 안에 끝나는 분량으로 잡아야 주기가 돌아갑니다 — 200개짜리 목록은 다음 분기에 채워지지 않습니다</text>
  </g>
  <defs>
    <marker id="k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker>
  </defs>
</svg>
