<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="2026년 9월 패치의 서버 영향 취약점을 역할별로 배치하고 도메인 컨트롤러에 세 건이 겹치는 구조를 표시한 도식">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">

    <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">같은 패치, 역할에 따라 다른 급한 정도</text>

    <!-- DC 강조 -->
    <rect x="30" y="58" width="360" height="176" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/>
    <text x="210" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">도메인 컨트롤러 — 한 대에 세 건</text>

    <rect x="50" y="98" width="320" height="34" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="64" y="120" font-size="12.5" fill="#1f2937">CVE-2026-72982  Netlogon</text>
    <text x="356" y="120" text-anchor="end" font-size="12.5" font-weight="700" fill="#b91c1c">9.8</text>

    <rect x="50" y="138" width="320" height="34" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="64" y="160" font-size="12.5" fill="#1f2937">CVE-2026-69730  DNS (겸용이 흔함)</text>
    <text x="356" y="160" text-anchor="end" font-size="12.5" font-weight="700" fill="#b91c1c">9.8</text>

    <rect x="50" y="178" width="320" height="34" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="64" y="200" font-size="12.5" fill="#1f2937">CVE-2026-69676  Kerberos</text>
    <text x="356" y="200" text-anchor="end" font-size="12.5" fill="#6b7280">8.8</text>

    <text x="50" y="228" font-size="11.5" fill="#6b7280">이 한 대가 넘어가면 도메인 전체 인증이 넘어갑니다</text>

    <!-- 나머지 역할 -->
    <rect x="410" y="58" width="360" height="176" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="590" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">역할이 있으면 대상</text>
    <text x="428" y="112" font-size="12.5" fill="#1f2937">DHCP 서버 — CVE-2026-69845</text>
    <text x="428" y="136" font-size="12.5" fill="#1f2937">NFS 사용 파일 서버 — CVE-2026-69595</text>
    <text x="428" y="160" font-size="12.5" fill="#1f2937">메시지 큐(MSMQ) — CVE-2026-69579</text>
    <text x="428" y="184" font-size="12.5" fill="#1f2937">SSTP VPN — CVE-2026-73009</text>
    <text x="428" y="208" font-size="12.5" fill="#1f2937">원격 데스크톱 — CVE-2026-69525</text>
    <text x="428" y="228" font-size="11.5" fill="#6b7280">모두 9.8 · AV:N / PR:N / UI:N</text>

    <!-- Hyper-V -->
    <rect x="30" y="252" width="740" height="110" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <text x="50" y="278" font-size="15" font-weight="700" fill="#b91c1c">Hyper-V 호스트 — CVE-2026-69603 (8.8)</text>
    <text x="50" y="304" font-size="12.5" fill="#1f2937">점수는 낮지만 벡터가 다릅니다. AV:L / PR:L / <tspan font-weight="700">S:C (범위 변경)</tspan></text>

    <rect x="50" y="318" width="200" height="32" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <text x="150" y="339" text-anchor="middle" font-size="12" fill="#1f2937">게스트 VM 안의 권한</text>
    <path d="M254 334 L292 334" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#s1)"/>
    <rect x="296" y="318" width="200" height="32" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <text x="396" y="339" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">호스트로 넘어감</text>
    <text x="516" y="339" font-size="12" fill="#6b7280">호스트 한 대 = 올라간 업무 시스템 전부</text>

    <text x="30" y="392" font-size="12" fill="#1f2937">노출 조건: 무인증 원격 실행은 "그 포트에 누가 닿는가"가 위험을 정합니다.</text>
    <text x="30" y="414" font-size="12" fill="#6b7280">같은 CVE라도 인터넷에서 닿는 서버와 내부망 전용 서버는 등급이 다릅니다.</text>
    <text x="30" y="436" font-size="11.5" fill="#6b7280">CVE·CVSS는 2026-09-23 NVD 확인</text>
  </g>
  <defs>
    <marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
</svg>
