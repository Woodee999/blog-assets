<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <defs><marker id="m2" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#374151"/></marker></defs>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">
    <text x="40" y="36" font-size="20" font-weight="700" fill="#111827">접속 방식에 따라 대상 서버에 남는 것</text>

    <rect x="40" y="72" width="150" height="60" rx="8" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
    <text x="115" y="98" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">관리자 계정</text>
    <text x="115" y="119" font-size="11" fill="#6B7280" text-anchor="middle">관리 워크스테이션</text>

    <line x1="194" y1="102" x2="234" y2="102" stroke="#374151" stroke-width="2" marker-end="url(#m2)"/>
    <line x1="115" y1="136" x2="115" y2="228" stroke="#374151" stroke-width="2"/>
    <line x1="115" y1="228" x2="234" y2="228" stroke="#374151" stroke-width="2" marker-end="url(#m2)"/>
    <line x1="115" y1="228" x2="115" y2="330" stroke="#374151" stroke-width="2"/>
    <line x1="115" y1="330" x2="234" y2="330" stroke="#374151" stroke-width="2" marker-end="url(#m2)"/>

    <rect x="240" y="74" width="230" height="56" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2"/>
    <text x="355" y="98" font-size="14" font-weight="700" fill="#C0392B" text-anchor="middle">대화형 로그온 · 일반 RDP</text>
    <text x="355" y="119" font-size="11" fill="#4B5563" text-anchor="middle">서비스 계정 · 예약 작업 암호 저장</text>
    <text x="490" y="107" font-size="14" font-weight="700" fill="#C0392B">→ 재사용 가능한 자격 증명이 남음</text>

    <rect x="240" y="200" width="230" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="355" y="224" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">네트워크 접속</text>
    <text x="355" y="245" font-size="11" fill="#4B5563" text-anchor="middle">파일 공유 · 원격 관리 도구</text>
    <text x="490" y="233" font-size="14" fill="#374151">→ 남지 않음</text>

    <rect x="240" y="302" width="230" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="355" y="326" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">RDP 제한 관리자 모드</text>
    <text x="355" y="347" font-size="11" fill="#4B5563" text-anchor="middle">대상에 자격 증명을 전달하지 않음</text>
    <text x="490" y="335" font-size="14" fill="#374151">→ 남지 않음</text>

    <line x1="40" y1="386" x2="760" y2="386" stroke="#E5E7EB" stroke-width="1"/>
    <text x="40" y="412" font-size="13" fill="#6B7280">점검하러 들어간 서버가 이미 침해된 상태라면, 그 로그온 자체가 자격 증명을 넘겨주는 행위가 됩니다.</text>
  </g>
</svg>
