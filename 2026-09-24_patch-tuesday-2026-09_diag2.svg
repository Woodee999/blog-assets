<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="2026년 9월 정기 패치와 9월 14일 대역 외 패치를 대상별로 나눠 적용 순서를 표시한 순서도">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <g font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif">

    <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">적용 순서 — 되돌리기 어려운 것을 나중에</text>

    <!-- 타임라인 헤더 -->
    <text x="470" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">9월 8일 정기</text>
    <text x="650" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">9월 14일 대역 외</text>
    <path d="M370 70 L740 70" stroke="#d1d5db" stroke-width="1"/>

    <!-- 행 템플릿 -->
    <!-- 1 -->
    <circle cx="48" cy="102" r="15" fill="#1f2937"/>
    <text x="48" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="76" y="99" font-size="14" font-weight="700" fill="#1f2937">테스트 DC 1대</text>
    <text x="76" y="117" font-size="11" fill="#6b7280">dcdiag /test:replications 통과 확인</text>
    <rect x="386" y="86" width="168" height="32" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="470" y="107" text-anchor="middle" font-size="12" fill="#1f2937">KB5122871 / KB5122882</text>

    <!-- 2 -->
    <circle cx="48" cy="170" r="15" fill="#b91c1c"/>
    <text x="48" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="76" y="167" font-size="14" font-weight="700" fill="#b91c1c">사용자 단말 파일럿</text>
    <text x="76" y="185" font-size="11" fill="#6b7280">도메인 로그온 · Test-ComputerSecureChannel</text>
    <rect x="386" y="154" width="168" height="32" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="470" y="175" text-anchor="middle" font-size="12" fill="#1f2937">KB5124008</text>
    <rect x="566" y="154" width="168" height="32" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <text x="650" y="175" text-anchor="middle" font-size="12" fill="#b91c1c">KB5129195</text>

    <!-- 3 -->
    <circle cx="48" cy="238" r="15" fill="#1f2937"/>
    <text x="48" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="76" y="235" font-size="14" font-weight="700" fill="#1f2937">나머지 도메인 컨트롤러</text>
    <text x="76" y="253" font-size="11" fill="#6b7280">DNS 응답 · 복제 상태 확인</text>
    <rect x="386" y="222" width="168" height="32" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="470" y="243" text-anchor="middle" font-size="12" fill="#1f2937">KB5122871 / KB5122882</text>

    <!-- 4 -->
    <circle cx="48" cy="306" r="15" fill="#b91c1c"/>
    <text x="48" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
    <text x="76" y="303" font-size="14" font-weight="700" fill="#b91c1c">RDS 서버</text>
    <text x="76" y="321" font-size="11" fill="#6b7280">세션 접속 · 재연결 확인 (둘을 함께 적용)</text>
    <rect x="386" y="290" width="168" height="32" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="470" y="311" text-anchor="middle" font-size="12" fill="#1f2937">KB5122871 / KB5122882</text>
    <rect x="566" y="290" width="168" height="32" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <text x="650" y="311" text-anchor="middle" font-size="12" fill="#b91c1c">KB5129235 / KB5129237</text>

    <!-- 5 -->
    <circle cx="48" cy="374" r="15" fill="#1f2937"/>
    <text x="48" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
    <text x="76" y="371" font-size="14" font-weight="700" fill="#1f2937">나머지 클라이언트</text>
    <text x="76" y="389" font-size="11" fill="#6b7280">로그온 성공률 관찰</text>
    <rect x="386" y="358" width="168" height="32" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <text x="470" y="379" text-anchor="middle" font-size="12" fill="#1f2937">KB5124008</text>
    <rect x="566" y="358" width="168" height="32" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <text x="650" y="379" text-anchor="middle" font-size="12" fill="#b91c1c">KB5129195</text>

    <text x="48" y="426" font-size="11" fill="#6b7280">빨간 테두리 = 대역 외까지 넣어야 장애가 재현되지 않는 대상</text>
  </g>
</svg>
